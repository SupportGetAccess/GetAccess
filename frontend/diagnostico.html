<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagnóstico - Access ON</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #fff; }
        .ok { color: #4ade80; }
        .error { color: #ef4444; }
        .test { margin: 10px 0; padding: 10px; background: #2a2a3e; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Diagnóstico de Conexión</h1>
    <div id="result"></div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        const results = document.getElementById('result');
        
        async function test(name, url, options = {}) {
            const div = document.createElement('div');
            div.className = 'test';
            div.textContent = `⏳ Probando: ${name}...`;
            results.appendChild(div);
            
            try {
                const res = await fetch(url, options);
                div.innerHTML = `✅ <span class="ok">OK</span>: ${name} - Estado: ${res.status}`;
            } catch (err) {
                div.innerHTML = `❌ <span class="error">ERROR</span>: ${name} - ${err.message}`;
            }
        }
        
        async function runTests() {
            await test('Backend root', API_URL + '/');
            await test('Lista eventos', API_URL + '/api/eventos/');
            
            // Test registro
            await test('Registro usuario', API_URL + '/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'diag@test.com', nombre: 'Diag', apellido: 'Test', password: '123456' })
            });
        }
        
        runTests();
    </script>
</body>
</html>
