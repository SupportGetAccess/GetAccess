    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { 
            --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8;
            --secondary: #ec4899; --accent: #10b981;
            --bg-dark: #1a1a2e; --bg-card: #252542; --bg-card-hover: #2f2f52;
            --text: #f8fafc; --text-muted: #94a3b8; --text-dim: #64748b;
            --success: #10b981; --error: #ef4444; --warning: #f59e0b;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --glow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
        body {

            color: var(--text);
            background-attachment: fixed;
        }
        
        header { 
            background: rgba(30, 30, 63, 0.85); 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;

        .login-screen {

        .login-box {

        .login-box .logo-container {

<body>
    <div id="root"></div>
    <script type="text/babel">
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? (window.location.protocol === 'https:' ? `https://${window.location.hostname}:8443` : 'http://localhost:8000')
            : 'https://getaccess-d3um.onrender.com';
        
        function App() {
            const [user, setUser] = React.useState(null);
            const [token, setToken] = React.useState(sessionStorage.getItem('token'));
            const [eventos, setEventos] = React.useState([]);
            const [eventoId, setEventoId] = React.useState('');
            const [stats, setStats] = React.useState({ total_entradas: 0, validadas: 0, pendientes: 0 });
            const [resultado, setResultado] = React.useState(null);
            const [historial, setHistorial] = React.useState([]);
            const [scanning, setScanning] = React.useState(false);
            const [manualCode, setManualCode] = React.useState('');
            const [toast, setToast] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [imagePreview, setImagePreview] = React.useState(null);
            const [scanningImage, setScanningImage] = React.useState(false);
            const [isOnline, setIsOnline] = React.useState(navigator.onLine);
            const [cachedCodes, setCachedCodes] = React.useState([]);
            const [pendingValidations, setPendingValidations] = React.useState([]);
            const [loggedIn, setLoggedIn] = React.useState(false);
            
            const html5QrCodeScannerRef = React.useRef(null);
            
            React.useEffect(() => {
                const handleOnline = () => { setIsOnline(true); sincronizarValidaciones(); };
                const handleOffline = () => { setIsOnline(false); };
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);
            
            React.useEffect(() => {
                if (isOnline && token && eventoId) {
                    cargarCodigosParaOffline();
                    sincronizarValidaciones();
                }
            }, [isOnline, eventoId, token]);
            
            async function cargarCodigosParaOffline() {
                if (!eventoId || !token) return;
                try {
                    const res = await fetch(`${API_URL}/api/eventos/${eventoId}/codigos-validos`, { headers: { Authorization: `Bearer ${token}` } });
                    if (res.ok) {
                        const data = await res.json();
                        setCachedCodes(data.codigos || []);
                        localStorage.setItem('cached_codes_' + eventoId, JSON.stringify(data.codigos || []));
                    }
                } catch {}
            }
            
            async function sincronizarValidaciones() {
                const pendientes = JSON.parse(localStorage.getItem('pending_validations') || '[]');
                if (pendientes.length === 0 || !token) return;
                for (const v of pendientes) {
                    try {
                        await fetch(`${API_URL}/api/validar-entrada`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                            body: JSON.stringify({ codigo: v.codigo, evento_id: v.evento_id, offline: true })
                        });
                    } catch {}
                }
                localStorage.setItem('pending_validations', '[]');
                setPendingValidations([]);
                showToast('Validaciones offline sincronizadas', 'success');
            }
            
            React.useEffect(() => {
                if (token) verificarToken();
                else setLoading(false);
                cargarEventos();
            }, []);
            
            React.useEffect(() => {
                if (eventoId) {
                    cargarEstadisticas();
                    cargarHistorial();
                } else {
                    setStats({ total_entradas: 0, validadas: 0, pendientes: 0 });
                    setHistorial([]);
                }
            }, [eventoId]);
            
            async function verificarToken() {
                try {
                    const res = await fetch(`${API_URL}/api/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.rol === 'admin') {
                            setUser(data);
                            setLoggedIn(true);
                            showToast('Bienvenido admin', 'success');
                        } else {
                            logout();
                            alert('Acceso no autorizado. Solo administradores.');
                        }
                    } else {
                        logout();
                        showToast('Sesion expirada', 'error');
                    }
                } catch { logout(); }
                setLoading(false);
            }
            
            async function login(e) {
                e.preventDefault();
                const email = e.target.email.value;
                const password = e.target.password.value;
                try {
                    const res = await fetch(`${API_URL}/api/auth/login`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        if (data.user && data.user.rol === 'admin') {
                            sessionStorage.setItem('token', data.access_token);
setToken(data.access_token);
                            setUser(data.user);
                            setLoggedIn(true);
                        } else {
                            alert('Acceso no autorizado. Solo administradores.');
                        }
                    } else {
                        showToast(data.detail || 'Error', 'error');
                    }
                } catch (err) { 
                    showToast('Error de conexion', 'error'); 
                }
            }
            
            function logout() {
                stopCamera();
                sessionStorage.removeItem('token');
                setToken(null);
                setUser(null);
                setLoggedIn(false);
            }
            
            async function cargarEventos() {
                try {
                    const res = await fetch(`${API_URL}/api/eventos/`);
                    const data = await res.json();
                    setEventos(data);
                } catch (e) { console.error(e); }
            }
            
            async function cargarEstadisticas() {
                if (!eventoId) return;
                try {
                    const res = await fetch(`${API_URL}/api/eventos/${eventoId}/estadisticas`);
                    if (res.ok) setStats(await res.json());
                } catch (e) { console.error(e); }
            }
            
            async function cargarHistorial() {
                try {
                    const url = eventoId 
                        ? `${API_URL}/api/validaciones/historial?evento_id=${eventoId}`
                        : `${API_URL}/api/validaciones/historial`;
                    const res = await fetch(url);
                    if (res.ok) setHistorial(await res.json());
                } catch (e) { console.error(e); }
            }
            
            async function validarCodigo(codigo) {
                setResultado(null);
                
                if (!isOnline) {
                    const codigoValido = cachedCodes.find(c => c.codigo === codigo);
                    if (!codigoValido) {
                        setResultado({ valida: false, mensaje: 'Código no encontrado (offline)', offline: true });
                        playSound(false);
                        return;
                    }
                    
                    if (codigoValido.usada) {
                        setResultado({ valida: false, mensaje: 'Entrada ya utilizada', offline: true });
                        playSound(false);
                        return;
                    }
                    
                    const pendiente = { codigo, evento_id: parseInt(eventoId), timestamp: new Date().toISOString() };
                    const actuales = JSON.parse(localStorage.getItem('pending_validations') || '[]');
                    localStorage.setItem('pending_validations', JSON.stringify([...actuales, pendiente]));
                    setPendingValidations([...actuales, pendiente]);
                    
                    setResultado({ valida: true, mensaje: 'Validado (offline) - se sincronizará luego', offline: true });
                    playSound(true);
                    showToast('Validado sin conexión', 'success');
                    return;
                }
                
                try {
                    const res = await fetch(`${API_URL}/api/validar-entrada`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                        body: JSON.stringify({ codigo, evento_id: eventoId ? parseInt(eventoId) : null })
                    });
                    const data = await res.json();
                    setResultado(data);
                    if (data.valida) { playSound(true); cargarEstadisticas(); cargarHistorial(); cargarCodigosParaOffline(); }
                    else playSound(false);
                } catch { 
                    const codigoValido = cachedCodes.find(c => c.codigo === codigo);
                    if (codigoValido && !codigoValido.usada) {
                        const pendiente = { codigo, evento_id: parseInt(eventoId), timestamp: new Date().toISOString() };
                        const actuales = JSON.parse(localStorage.getItem('pending_validations') || '[]');
                        localStorage.setItem('pending_validations', JSON.stringify([...actuales, pendiente]));
                        setResultado({ valida: true, mensaje: 'Validado sin conexión', offline: true });
                        playSound(true);
                        showToast('Validado offline', 'success');
                    } else {
                        showToast('Error de conexion', 'error'); 
                    }
                }
            }
            
            function playSound(success) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = success ? 880 : 220;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
            
            function showToast(msg, type = 'success') {
                setToast({ message: msg, type });
                setTimeout(() => setToast(null), 3000);
            }
            
            function startCamera() {
                setScanning(true);
                setResultado(null);
                
                if (typeof Html5Qrcode === 'undefined') {
                    showToast('Error: Biblioteca de scanner no cargo', 'error');
                    setScanning(false);
                    return;
                }
                
                const html5QrCode = new Html5Qrcode("qr-reader");
                html5QrCodeScannerRef.current = html5QrCode;
                
                Html5Qrcode.getCameras().then(cameras => {
                    if (cameras && cameras.length) {
                        const cameraId = cameras[cameras.length - 1].id;
                        html5QrCode.start(
                            cameraId,
                            { 
                                fps: 10, 
                                qrbox: function(viewfinderWidth, viewfinderHeight) {
                                    const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                                    return { width: minEdge * 0.7, height: minEdge * 0.7 };
                                },
                                aspectRatio: 1.0 
                            },
                            (decodedText) => {
                                html5QrCode.stop().then(() => {
                                    setScanning(false);
                                    validarCodigo(decodedText);
                                });
                            },
                            () => {}
                        ).catch((err) => {
                            showToast('Error al iniciar camara: ' + err, 'error');
                            setScanning(false);
                        });
                    } else {
                        showToast('No se encontraron camaras', 'error');
                        setScanning(false);
                    }
                }).catch((err) => {
                    showToast('Error al buscar camaras: ' + err, 'error');
                    setScanning(false);
                });
            }
            
            function stopCamera() {
                setScanning(false);
                if (html5QrCodeScannerRef.current) {
                    try {
                        html5QrCodeScannerRef.current.stop().then(() => {
                            html5QrCodeScannerRef.current = null;
                        }).catch(() => {
                            html5QrCodeScannerRef.current = null;
                        });
                    } catch (e) {
                        html5QrCodeScannerRef.current = null;
                    }
                }
            }
            
            function handleManualSubmit(e) {
                e.preventDefault();
                if (manualCode.trim()) validarCodigo(manualCode.trim());
            }
            
            async function handleImageUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                setImagePreview(URL.createObjectURL(file));
                setScanningImage(true);
                
                try {
                    if (typeof Html5Qrcode === 'undefined') {
                        showToast('Error: Biblioteca no cargada', 'error');
                        return;
                    }
                    
                    const html5QrCode = new Html5Qrcode("image-qr-reader");
                    const result = await html5QrCode.scanFile(file, true);
                    setScanningImage(false);
                    setImagePreview(null);
                    validarCodigo(result);
                } catch (err) {
                    setScanningImage(false);
                    if (err?.message?.includes('No MultiFormat Readers')) {
                        showToast('No se detecto QR en la imagen', 'warning');
                    } else {
                        showToast('Error al escanear imagen', 'error');
                    }
                }
            }
            
            function formatTime(ts) {
                const d = new Date(ts);
                return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            }
            
            function getResultClass() {
                if (!resultado) return '';
                if (resultado.valida) return 'result-aceptada';
                if (resultado.estado === 'ya_usada') return 'result-ya-usada';
                return 'result-rechazada';
            }
            
            function getResultIcon() {
                if (!resultado) return '';
                if (resultado.valida) return '✅';
                if (resultado.estado === 'ya_usada') return '⚠️';
                return '❌';
            }
            
            if (loading) return (
                <div className="login-screen">
                    <div className="loading"><div className="spinner"></div></div>
                </div>
            );
            
            if (!user) return (
                <div className="login-screen">
                    <div className="login-box">
                        <div className="logo-container">
                            <svg viewBox="0 0 100 100">
                                <defs>
                                    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stopColor="#6366f1"/>
                                        <stop offset="100%" stopColor="#ec4899"/>
                                    </linearGradient>
                                </defs>
                                <rect x="10" y="25" width="80" height="55" rx="8" fill="url(#loginGrad)"/>
                                <circle cx="30" cy="52" r="8" fill="white"/>
                                <circle cx="70" cy="52" r="8" fill="white"/>
                                <rect x="38" y="48" width="24" height="8" fill="white" rx="2"/>
                                <rect x="35" y="15" width="30" height="15" rx="4" fill="url(#loginGrad)"/>
                            </svg>
                        </div>
                        <h2>Get Access - Scanner QR</h2>
                        <form onSubmit={login}>
                            <input name="email" type="email" placeholder="Email" required />
                            <input name="password" type="password" placeholder="Contraseña" required />
                            <button type="submit">Iniciar Sesion</button>
                        </form>
                    </div>
                </div>
            );
            
            return (
                <div>
                    <header>
                        <div className="logo">
                            <svg width="40" height="40" viewBox="0 0 100 100">
                                <defs>
                                    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stopColor="#6366f1"/>
                                        <stop offset="100%" stopColor="#ec4899"/>
                                    </linearGradient>
                                </defs>
                                <rect x="10" y="25" width="80" height="55" rx="8" fill="url(#headerGrad)"/>
                                <circle cx="30" cy="52" r="8" fill="white"/>
                                <circle cx="70" cy="52" r="8" fill="white"/>
                                <rect x="38" y="48" width="24" height="8" fill="white" rx="2"/>
                                <rect x="35" y="15" width="30" height="15" rx="4" fill="url(#headerGrad)"/>
                            </svg>
                            <span className="logo-text">Get Access</span>
                        </div>
                        <div style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
                            {pendingValidations.length > 0 && <span style={{fontSize: '12px', color: '#f59e0b'}}>{pendingValidations.length} pendientes</span>}
                            <span style={{display: 'flex', alignItems: 'center', gap: '5px', fontSize: '12px', padding: '4px 8px', borderRadius: '20px', background: isOnline ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)', color: isOnline ? '#10b981' : '#ef4444'}}>
                                <span style={{width: '8px', height: '8px', borderRadius: '50%', background: isOnline ? '#10b981' : '#ef4444'}}></span>
                                {isOnline ? 'En linea' : 'Sin conexion'}
                            </span>
                            <button className="header-btn" onClick={logout}>Cerrar Sesion</button>
                        </div>
                    </header>
                    
                    <div className="container">
                        <div className="hero">
                            <div className="hero-icon">📱</div>
                            <h1>Scanner QR</h1>
                            <p>Valida las entradas de tus eventos</p>
                        </div>
                        
                        <div className="stats-grid">
                            <div className="stat-card">
                                <div className="stat-icon">🎫</div>
                                <div className="stat-number">{stats.total_entradas}</div>
                                <div className="stat-label">Total</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-icon">✅</div>
                                <div className="stat-number">{stats.validadas}</div>
                                <div className="stat-label">Validadas</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-icon">📋</div>
                                <div className="stat-number">{stats.pendientes}</div>
                                <div className="stat-label">Disponibles</div>
                            </div>
                        </div>
                        
                        <div className="event-selector">
                            <label>Seleccionar Evento:</label>
                            <select value={eventoId} onChange={e => {
                                setEventoId(e.target.value);
                                setResultado(null);
                            }}>
                                <option value="">-- Seleccionar evento --</option>
                                {eventos.map(ev => <option key={ev.id} value={ev.id}>{ev.nombre}</option>)}
                            </select>
                        </div>
                        
                        <div className="scanner-result-container">
                            <div className="scanner-card">
                                <div className="scanner-header">
                                    <div className="scanner-title">
                                        <span>📷</span> Escanear Codigo QR
                                    </div>
                                    <button className={`scan-btn ${scanning ? 'scanning' : ''}`} onClick={scanning ? stopCamera : startCamera}>
                                        {scanning ? '⏹️ Detener' : '▶️ Iniciar Scanner'}
                                    </button>
                                </div>
                                <div id="qr-reader" style={{width: '100%', borderRadius: '16px', overflow: 'hidden'}}></div>
                                
                                <div className="input-section">
                                    <h4>Otras opciones de validacion:</h4>
                                    <form className="manual-input" onSubmit={handleManualSubmit}>
                                        <div className="input-group">
                                            <input value={manualCode} onChange={e => setManualCode(e.target.value)} placeholder="GA-000001-001" />
                                            <button type="submit">Validar</button>
                                        </div>
                                    </form>
                                    <div className="image-upload">
                                        <label>
                                            <span className="image-upload-icon">📤</span>
                                            <span>Subir imagen QR</span>
                                            <input type="file" accept="image/*" onChange={handleImageUpload} />
                                        </label>
                                        {imagePreview && (
                                            <div className="image-preview">
                                                <img src={imagePreview} alt="QR Preview" />
                                                <input type="hidden" id="image-qr-reader" />
                                                {scanningImage && (
                                                    <div className="loading-overlay">
                                                        <div className="spinner"></div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            
                            {resultado && (
                            <div className={`result-card ${getResultClass()}`}>
                                <div className="result-content">
                                    <div className="result-icon">{getResultIcon()}</div>
                                    <div className="result-status">
                                        {resultado.valida ? 'ACEPTADA' : resultado.estado === 'ya_usada' ? 'YA USADA' : 'RECHAZADA'}
                                    </div>
                                    <div className="result-message">{resultado.mensaje}</div>
                                </div>
                                <div className="result-details">
                                    {resultado.usuario && (
                                        <div className="result-row">Usuario: {resultado.usuario}</div>
                                    )}
                                    {resultado.evento && (
                                        <div className="result-row">Evento: {resultado.evento}</div>
                                    )}
                                    {resultado.fecha && (
                                        <div className="result-row">Fecha: {resultado.fecha}</div>
                                    )}
                                    <div className="result-row">ID Entrada: #{resultado.entrada_id}</div>
                                </div>
                            </div>
                            )}
                        </div>
                        
                        <div className="history-section">
                            <div className="history-header">
                                <span style={{fontSize: '1.5rem'}}>📋</span>
                                <span className="history-title">Ultimas Validaciones</span>
                            </div>
                            <div className="history-list">
                                {historial.length === 0 && (
                                    <div className="empty-history">
                                        <span>📭</span>
                                        <p>Sin validaciones aun</p>
                                    </div>
                                )}
                                {historial.map(h => (
                                    <div key={h.id} className="history-item">
                                        <div className="history-icon">✅</div>
                                        <div className="history-info">
                                            <div className="history-user">{h.scanner}</div>
                                            <div className="history-event">{h.evento_nombre}</div>
                                            <div className="history-time">{formatTime(h.timestamp)}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    {toast && <div className={`toast ${toast.type}`}>{toast.message}</div>}
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
