            const [editando, setEditando] = useState(null);
            const [guardando, setGuardando] = useState(false);
            const [tab, setTab] = useState('crear');
            const [solicitudes, setSolicitudes] = useState([]);
            const [cargandoSolicitudes, setCargandoSolicitudes] = useState(false);
            
            const parseFecha = (fecha) => {
                if (!fecha) return new Date(0);
                if (fecha.includes(' ') && fecha.match(/\d{2}:\d{2}:\d{2}/)) {
                    return new Date(fecha.replace(' ', 'T'));
                }
                return new Date(fecha + 'T12:00:00');
            };
            
            useEffect(() => {
                cargarEventos();
            }, []);
            
            const cargarEventos = async () => {
                setLoading(true);
                try {
                    let url = API_URL + '/api/eventos/';
                    const isOrg = user && user.rol === 'organizer';
                    if (isOrg) {
                        url += '?mis_eventos=true';
                    }
                    const res = await fetch(url, isOrg ? { headers: { 'Authorization': 'Bearer ' + token } } : {});
                    if (res.ok) {
                        const data = await res.json();
                        setEventos(Array.isArray(data) ? data : []);
                    } else {
                        setEventos([]);
                    }
                } catch (err) { showToast('Error cargando eventos', 'error'); setEventos([]); }
                setLoading(false);
            };
            
            const handleChange = (e) => {
                setForm({ ...form, [e.target.name]: e.target.value });
            };

            const cargarSolicitudes = async () => {
                setCargandoSolicitudes(true);
                try {
                    const res = await fetch(API_URL + '/api/admin/solicitudes-organizer', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setSolicitudes(data);
                    }
                } catch (err) { console.error(err); }
                setCargandoSolicitudes(false);
            };

            const aprobarSolicitud = async (solicitudId) => {
                try {
                    const res = await fetch(API_URL + '/api/admin/aprobar-organizer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ solicitud_id: solicitudId })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast('Organizador aprobado', 'success');
                        cargarSolicitudes();
                    } else {
                        showToast(data.detail || 'Error', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
            };

            const rechazarSolicitud = async (solicitudId) => {
                const motivo = prompt('Motivo del rechazo (opcional):');
                try {
                    const res = await fetch(API_URL + '/api/admin/rechazar-organizer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ solicitud_id: solicitudId, motivo: motivo || null })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast('Solicitud rechazada', 'success');
                        cargarSolicitudes();
                    } else {
                        showToast(data.detail || 'Error', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
            };

            const handleImagenFile = (index, e) => {
                const file = e.target.files[0];
                if (file) {
                    if (!file.type.startsWith('image/')) {
                        showToast('Selecciona un archivo de imagen válido', 'error');
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        showToast('La imagen debe ser menor a 5MB', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const nuevosPreviews = [...imagenPreviews];
                        nuevosPreviews[index] = reader.result;
                        setImagenPreviews(nuevosPreviews);
                    };
                    reader.readAsDataURL(file);
                    // Guardar el archivo real
                    const nuevosArchivos = [...imagenArchivos];
                    nuevosArchivos[index] = file;
                    setImagenArchivos(nuevosArchivos);
                }
            };
            
            const limpiarImagen = (index) => {
                const nuevosPreviews = [...imagenPreviews];
                nuevosPreviews[index] = null;
                setImagenPreviews(nuevosPreviews);
                const nuevosArchivos = [...imagenArchivos];
                nuevosArchivos[index] = null;
                setImagenArchivos(nuevosArchivos);
            };
            
            const crearEvento = async (e) => {
                e.preventDefault();
                if (!form.nombre || !form.fecha || !form.lugar || !form.precio || !form.capacidad) {
                    showToast('Completa todos los campos requeridos', 'error');
                    return;
                }
                
                setGuardando(true);
                try {
                    const formData = new FormData();
                    formData.append('nombre', form.nombre);
                    formData.append('descripcion', form.descripcion);
                    formData.append('fecha', form.fecha);
                    formData.append('lugar', form.lugar);
                    formData.append('precio', form.precio);
                    formData.append('capacidad', form.capacidad);
                    formData.append('categoria', form.categoria || '');
                    formData.append('comision', form.comision || 0);
                    
                    // Agregar las imágenes como archivos
                    imagenArchivos.forEach((archivo, index) => {
                        if (archivo) {
                            formData.append(`imagen_${index + 1}`, archivo);
                        }
                    });
                    
                    const res = await fetch(API_URL + '/api/eventos/', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    
                    if (res.ok) {
                        showToast('Evento creado exitosamente', 'success');
                        setForm({ nombre: '', descripcion: '', fecha: '', lugar: '', precio: '', capacidad: '', imagen: '', imagenes: ['', '', '', ''], categoria: '', comision: 0 });
                        setImagenPreviews([null, null, null, null]);
                        setImagenArchivos([null, null, null, null]);
                        cargarEventos();
                    } else {
                        const data = await res.json();
                        showToast(data.detail || 'Error al crear evento', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
                setGuardando(false);
            };
            
            const editarEvento = (ev) => {
                let imagenesCargadas = ['', '', '', ''];
                let previewsCargados = [null, null, null, null];
                let archivosCargados = [null, null, null, null];
                
                if (ev.imagen) {
                    try {
                        const parsed = JSON.parse(ev.imagen);
                        if (Array.isArray(parsed)) {
                            parsed.forEach((img, i) => {
                                if (i < 4 && img) {
                                    imagenesCargadas[i] = img;
                                    previewsCargados[i] = img;
                                    archivosCargados[i] = img; // Marcar como existente
                                }
                            });
                        } else if (typeof parsed === 'string' && parsed.length > 0) {
                            imagenesCargadas[0] = parsed;
                            previewsCargados[0] = parsed;
                            archivosCargados[0] = parsed;
                        }
                    } catch {
                        if (ev.imagen && ev.imagen.length > 0 && typeof ev.imagen === 'string') {
                            imagenesCargadas[0] = ev.imagen;
                            previewsCargados[0] = ev.imagen;
                            archivosCargados[0] = ev.imagen;
                        }
                    }
                }
                
                setEditando(ev);
                setForm({
                    nombre: ev.nombre || '',
                    descripcion: ev.descripcion || '',
                    fecha: ev.fecha ? ev.fecha.split('T')[0].split(' ')[0] : '',
                    lugar: ev.lugar || '',
                    precio: ev.precio?.toString() || '',
                    capacidad: ev.capacidad?.toString() || '',
                    imagen: ev.imagen || '',
                    imagenes: imagenesCargadas,
                    categoria: ev.categoria || '',
                    comision: ev.comision || 0
                });
                setImagenPreviews(previewsCargados);
                setImagenArchivos(archivosCargados);
                setTab('editar');
            };
            
            const guardarEdicion = async (e) => {
                e.preventDefault();
                if (!form.nombre || !form.fecha || !form.lugar || !form.precio || !form.capacidad) {
                    showToast('Completa todos los campos requeridos', 'error');
                    return;
                }
                
                setGuardando(true);
                try {
                    const formData = new FormData();
                    formData.append('nombre', form.nombre);
                    formData.append('descripcion', form.descripcion);
                    formData.append('fecha', form.fecha);
                    formData.append('lugar', form.lugar);
                    formData.append('precio', form.precio);
                    formData.append('capacidad', form.capacidad);
                    formData.append('categoria', form.categoria || '');
                    formData.append('comision', form.comision || 0);
                    
                    // Agregar las imágenes - solo las nuevas (archivos), no las URLs existentes
                    imagenArchivos.forEach((archivo, index) => {
                        if (archivo && typeof archivo !== 'string') {
                            // Solo enviar si es un archivo nuevo (no string/URL)
                            formData.append(`imagen_${index + 1}`, archivo);
                        }
                    });
                    
                    const res = await fetch(API_URL + '/api/eventos/' + editando.id, {
                        method: 'PUT',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    
                    if (res.ok) {
                        showToast('Evento actualizado correctamente', 'success');
                        setEditando(null);
                        setForm({ nombre: '', descripcion: '', fecha: '', lugar: '', precio: '', capacidad: '', imagen: '', imagenes: ['', '', '', ''], categoria: '', comision: 0 });
                        setImagenPreviews([null, null, null, null]);
                        setImagenArchivos([null, null, null, null]);
                        setTab('crear');
                        cargarEventos();
                    } else {
                        const data = await res.json();
                        showToast(data.detail || 'Error al actualizar evento', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
                setGuardando(false);
            };
            
            const eliminarEvento = async (ev) => {
                const esPasado = parseFecha(ev.fecha) < parseFecha();
                
                if (user.rol === 'organizer' && !esPasado) {
                    alert('Para eliminar un evento, comunícate con el administrador o escribe a soporte@getaccess.com.ar');
                    return;
                }
                
                if (!confirm(`¿Estás seguro de eliminar "${ev.nombre}"? Esta acción no se puede deshacer.`)) return;
                
                try {
                    const res = await fetch(API_URL + '/api/eventos/' + ev.id, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    
                    if (res.ok) {
                        showToast('Evento eliminado', 'success');
                        cargarEventos();
                    } else {
                        const data = await res.json();
                        showToast(data.detail || 'Error al eliminar', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
            };
            
            const cancelarEdicion = () => {
                setEditando(null);
                setForm({ nombre: '', descripcion: '', fecha: '', lugar: '', precio: '', capacidad: '', imagen: '', imagenes: ['', '', '', ''], categoria: '', comision: 0 });
                setImagenPreviews([null, null, null, null]);
                setTab('crear');
            };
            
            if (loading) return <div className="loading">Cargando...</div>;
            
            return (
                <>
                    <div className="hero">
                        <h1>⚙️ Panel de Administración</h1>
                        <p>Gestiona los eventos de Get Access</p>
                    </div>
                    
                    <div style={{display:'flex', gap:'0.5rem', marginBottom:'1.5rem', flexWrap:'wrap'}}>
                        {(user && (user.rol === 'admin' || user.rol === 'organizer')) && <button onClick={() => { setTab('crear'); setEditando(null); setForm({ nombre: '', descripcion: '', fecha: '', lugar: '', precio: '', capacidad: '', imagen: '', imagenes: ['', '', '', ''], categoria: '', comision: 0 }); setImagenPreviews([null, null, null, null]); }} style={{background: tab === 'crear' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: tab === 'crear' ? 'var(--glow)' : 'none'}}>➕ Crear Evento</button>}
                        {user && (user.rol === 'admin' || user.rol === 'organizer') && <button onClick={() => setTab('editar')} style={{background: tab === 'editar' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: tab === 'editar' ? 'var(--glow)' : 'none'}}>✏️ Editar / Eliminar</button>}
                        {user && (user.rol === 'admin' || user.rol === 'organizer') && <button onClick={() => setTab('scanner')} style={{background: tab === 'scanner' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: tab === 'scanner' ? 'var(--glow)' : 'none'}}>📷 Scanner QR</button>}
                        <button onClick={() => setTab('analytics')} style={{background: tab === 'analytics' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: tab === 'analytics' ? 'var(--glow)' : 'none'}}>📊 Analytics</button>
                        {user && user.rol === 'admin' && <button onClick={async () => { setTab('solicitudes'); cargarSolicitudes(); }} style={{background: tab === 'solicitudes' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: tab === 'solicitudes' ? 'var(--glow)' : 'none'}}>📋 Solicitudes ({solicitudes.length})</button>}
                    </div>
                    
                    {tab === 'crear' && (
                        <div className="form-box" style={{maxWidth:'800px', margin:'0 auto'}}>
                            <h2 style={{fontSize:'1.3rem', marginBottom:'1.5rem'}}>➕ Crear Nuevo Evento</h2>
                            <form onSubmit={crearEvento}>
                                <div className="form-group"><label>📝 Nombre del Evento *</label><input type="text" name="nombre" value={form.nombre} onChange={handleChange} required /></div>
                                <div className="form-group"><label>📄 Descripción</label><textarea name="descripcion" value={form.descripcion} onChange={handleChange} style={{width:'100%', padding:'1rem', border:'2px solid rgba(255,255,255,0.1)', background:'rgba(0,0,0,0.3)', color:'white', borderRadius:'14px', minHeight:'80px', resize:'vertical'}} /></div>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                    <div className="form-group"><label>📅 Fecha *</label><input type="date" name="fecha" value={form.fecha} onChange={handleChange} required /></div>
                                    <div className="form-group"><label>📍 Lugar *</label><input type="text" name="lugar" value={form.lugar} onChange={handleChange} required /></div>
                                </div>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                    <div className="form-group"><label>💰 Precio (ARS) *</label><input type="number" name="precio" value={form.precio} onChange={handleChange} min="0" required /></div>
                                    <div className="form-group"><label>🎫 Capacidad *</label><input type="number" name="capacidad" value={form.capacidad} onChange={handleChange} min="1" required /></div>
                                </div>
                                <div className="form-group"><label>💼 Cargo por servicios (%)</label><input type="number" name="comision" value={form.comision || 0} onChange={handleChange} min="0" max="100" placeholder="0" /><small style={{color:'var(--text-dim)', fontSize:'0.75rem'}}>Porcentaje adicional que paga el comprador (0-100%)</small></div>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                    <div className="form-group"><label>🏷️ Categoría</label>
                                        <select name="categoria" value={form.categoria} onChange={handleChange} style={{width:'100%', padding:'1rem', border:'2px solid rgba(255,255,255,0.1)', background:'var(--bg-card)', color:'white', borderRadius:'14px'}}>
                                            <option value="">Sin categoría</option>
                                            <option value="musica">🎵 Música</option>
                                            <option value="teatro">🎭 Teatro</option>
                                            <option value="deportes">⚽ Deportes</option>
                                            <option value="comedia">😂 Comedia</option>
                                            <option value="conferencia">💼 Conferencia</option>
                                            <option value="espectaculo">🎪 Espectáculo</option>
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>🖼️ Imágenes del Evento (hasta 4, opcional)</label>
                                        <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'0.5rem', marginBottom:'0.75rem'}}>
                                            {[0, 1, 2, 3].map(i => (
                                                <div key={i} style={{position:'relative', aspectRatio:'1', border:'2px dashed rgba(255,255,255,0.2)', borderRadius:'8px', overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.2)'}}>
                                                    {imagenPreviews[i] ? (
                                                        <>
                                                            <img src={getImagenUrl(imagenPreviews[i])} alt={`Preview ${i+1}`} style={{width:'100%', height:'100%', objectFit:'cover'}} />
                                                            <button onClick={() => limpiarImagen(i)} style={{position:'absolute', top:'2px', right:'2px', background:'rgba(239,68,68,0.9)', color:'white', border:'none', borderRadius:'50%', width:'20px', height:'20px', cursor:'pointer', fontSize:'10px', lineHeight:'20px', padding:0}}>✕</button>
                                                        </>
                                                    ) : (
                                                        <label style={{cursor:'pointer', width:'100%', height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', color:'var(--text-dim)', fontSize:'0.7rem'}}>
                                                            <span style={{fontSize:'1.2rem'}}>📷</span>
                                                            <span>Img {i+1}</span>
                                                            <input type="file" accept="image/*" onChange={(e) => handleImagenFile(i, e)} style={{display:'none'}} />
                                                        </label>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <small style={{color:'var(--text-dim)', fontSize:'0.75rem', display:'block'}}>Máx 5MB c/u. Formatos: JPG, PNG, GIF, WebP</small>
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-block" disabled={guardando}>{guardando ? <span className="spinner"></span> : '✅ Crear Evento'}</button>
                            </form>
                        </div>
                    )}
                    
                    {tab === 'editar' && (
                        <>
                            {editando ? (
                                <div className="form-box" style={{maxWidth:'800px', margin:'0 auto'}}>
                                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1.5rem'}}>
                                        <h2 style={{fontSize:'1.3rem', margin:0}}>✏️ Editando: {editando.nombre}</h2>
                                        <button onClick={cancelarEdicion} style={{background:'transparent', border:'1px solid rgba(255,255,255,0.2)', color:'var(--text-muted)', padding:'0.5rem 1rem', borderRadius:'8px', cursor:'pointer'}}>✕ Cancelar</button>
                                    </div>
                                    <form onSubmit={guardarEdicion}>
                                        <div className="form-group"><label>📝 Nombre del Evento *</label><input type="text" name="nombre" value={form.nombre} onChange={handleChange} required /></div>
                                        <div className="form-group"><label>📄 Descripción</label><textarea name="descripcion" value={form.descripcion} onChange={handleChange} style={{width:'100%', padding:'1rem', border:'2px solid rgba(255,255,255,0.1)', background:'rgba(0,0,0,0.3)', color:'white', borderRadius:'14px', minHeight:'80px', resize:'vertical'}} /></div>
                                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                            <div className="form-group"><label>📅 Fecha *</label><input type="date" name="fecha" value={form.fecha} onChange={handleChange} required /></div>
                                            <div className="form-group"><label>📍 Lugar *</label><input type="text" name="lugar" value={form.lugar} onChange={handleChange} required /></div>
                                        </div>
                                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                            <div className="form-group"><label>💰 Precio (ARS) *</label><input type="number" name="precio" value={form.precio} onChange={handleChange} min="0" required /></div>
                                            <div className="form-group"><label>🎫 Capacidad *</label><input type="number" name="capacidad" value={form.capacidad} onChange={handleChange} min="1" required /></div>
                                        </div>
                                        <div className="form-group"><label>💼 Cargo por servicios (%)</label><input type="number" name="comision" value={form.comision || 0} onChange={handleChange} min="0" max="100" placeholder="0" /><small style={{color:'var(--text-dim)', fontSize:'0.75rem'}}>Porcentaje adicional que paga el comprador (0-100%)</small></div>
                                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                            <div className="form-group"><label>🏷️ Categoría</label>
                                                <select name="categoria" value={form.categoria} onChange={handleChange} style={{width:'100%', padding:'1rem', border:'2px solid rgba(255,255,255,0.1)', background:'var(--bg-card)', color:'white', borderRadius:'14px'}}>
                                                    <option value="">Sin categoría</option>
                                                    <option value="musica">🎵 Música</option>
                                                    <option value="teatro">🎭 Teatro</option>
                                                    <option value="deportes">⚽ Deportes</option>
                                                    <option value="comedia">😂 Comedia</option>
                                                    <option value="conferencia">💼 Conferencia</option>
                                                    <option value="espectaculo">🎪 Espectáculo</option>
                                                </select>
                                            </div>
                                            <div className="form-group">
                                                <label>🖼️ Imágenes del Evento (hasta 4, opcional)</label>
                                                <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'0.5rem', marginBottom:'0.75rem'}}>
                                                    {[0, 1, 2, 3].map(i => (
                                                        <div key={i} style={{position:'relative', aspectRatio:'1', border:'2px dashed rgba(255,255,255,0.2)', borderRadius:'8px', overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.2)'}}>
                                                            {imagenPreviews[i] ? (
                                                                <>
                                                                    <img src={getImagenUrl(imagenPreviews[i])} alt={`Preview ${i+1}`} style={{width:'100%', height:'100%', objectFit:'cover'}} />
                                                                    <button onClick={() => limpiarImagen(i)} style={{position:'absolute', top:'2px', right:'2px', background:'rgba(239,68,68,0.9)', color:'white', border:'none', borderRadius:'50%', width:'20px', height:'20px', cursor:'pointer', fontSize:'10px', lineHeight:'20px', padding:0}}>✕</button>
                                                                </>
                                                            ) : (
                                                                <label style={{cursor:'pointer', width:'100%', height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', color:'var(--text-dim)', fontSize:'0.7rem'}}>
                                                                    <span style={{fontSize:'1.2rem'}}>📷</span>
                                                                    <span>Img {i+1}</span>
                                                                    <input type="file" accept="image/*" onChange={(e) => handleImagenFile(i, e)} style={{display:'none'}} />
                                                                </label>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                                <small style={{color:'var(--text-dim)', fontSize:'0.75rem', display:'block'}}>Máx 5MB c/u. Formatos: JPG, PNG, GIF, WebP</small>
                                            </div>
                                        </div>
                                        <button type="submit" className="btn btn-block" disabled={guardando}>{guardando ? <span className="spinner"></span> : '💾 Guardar Cambios'}</button>
                                    </form>
                                </div>
                            ) : (
                                <div>
                                    <h2 style={{marginBottom:'1rem'}}>📋 Selecciona un evento para editar</h2>
                                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))', gap:'1rem'}}>
                                        {eventos.map(ev => (
                                            <div key={ev.id} className="entrada-card admin-evento-card" style={{padding:'1.25rem', display:'block'}}>
                                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'0.5rem'}}>
                                                    <h4 style={{fontSize:'1rem', color:'var(--text)', margin:0, flex:1}}>{ev.nombre}</h4>
                                                    {ev.categoria && <span style={{fontSize:'0.7rem', background:'rgba(99,102,241,0.2)', padding:'0.2rem 0.5rem', borderRadius:'8px', color:'var(--primary-light)'}}>{ev.categoria.toUpperCase()}</span>}
                                                </div>
                                                <p style={{fontSize:'0.8rem', color:'var(--text-muted)', margin:'0.3rem 0'}}>📅 {parseFecha(ev.fecha).toLocaleDateString('es-AR')} | 📍 {ev.lugar}</p>
                                                <p style={{fontSize:'0.8rem', color:'var(--text-muted)', margin:'0.3rem 0'}}>💰 ${ev.precio.toLocaleString('es-AR')} | 🎫 {ev.disponibles}/{ev.capacidad}</p>
                                                <div style={{display:'flex', gap:'0.5rem', marginTop:'0.75rem'}}>
                                                    {(() => {
                                                        const esPasado = parseFecha(ev.fecha) < parseFecha();
                                                        return (
                                                            <>
                                                                <button onClick={() => editarEvento(ev)} disabled={esPasado} style={{flex:1, background: esPasado ? 'rgba(100,100,100,0.3)' : 'var(--primary)', border:'none', color: esPasado ? 'rgba(150,150,150,0.8)' : 'white', padding:'0.6rem', borderRadius:'10px', cursor: esPasado ? 'not-allowed' : 'pointer', fontWeight:'600', fontSize:'0.85rem'}}>✏️ Editar</button>
                                                                <button onClick={() => eliminarEvento(ev)} disabled={esPasado} style={{flex:1, background: esPasado ? 'rgba(100,100,100,0.3)' : 'rgba(239,68,68,0.2)', border:'none', color: esPasado ? 'rgba(150,150,150,0.8)' : 'var(--error)', padding:'0.6rem', borderRadius:'10px', cursor: esPasado ? 'not-allowed' : 'pointer', fontWeight:'600', fontSize:'0.85rem'}}>🗑️ Eliminar</button>
                                                            </>
                                                        );
                                                    })()}
                                                    <button onClick={() => irADetalle(ev.id)} style={{flex:1, background:'rgba(16,185,129,0.2)', border:'none', color:'var(--success)', padding:'0.6rem', borderRadius:'10px', cursor:'pointer', fontWeight:'600', fontSize:'0.85rem'}}>👁️ Ver</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                    
                    {tab === 'scanner' && user && (user.rol === 'admin' || user.rol === 'organizer') && (
                        <div style={{textAlign:'center', padding:'2rem'}}>
                            <h2 style={{fontSize:'1.5rem', marginBottom:'1rem'}}>📷 Scanner de Entradas QR{user.rol === 'organizer' ? ' - Solo tus eventos' : ''}</h2>
                            <p style={{color:'var(--text-muted)', marginBottom:'2rem'}}>Usa la app de validación para escanear códigos QR en los ingresos.</p>
                            <div style={{display:'flex', flexDirection:'column', gap:'1rem', alignItems:'center'}}>
                                <a href="/scanner.html" style={{background:'var(--gradient)', color:'white', padding:'1rem 2rem', borderRadius:'12px', textDecoration:'none', fontWeight:'bold', fontSize:'1.1rem', boxShadow:'var(--glow)'}}>
                                    📷 Abrir Scanner QR
                                </a>
                                <p style={{color:'var(--text-dim)', fontSize:'0.85rem'}}>Se abrirá en una nueva pestaña</p>
                            </div>
                            <div style={{marginTop:'2rem', background:'var(--bg-card)', padding:'1.5rem', borderRadius:'12px', textAlign:'left', maxWidth:'500px', margin:'2rem auto'}}>
                                <h3 style={{fontSize:'1rem', marginBottom:'0.5rem'}}>📋 Instrucciones:</h3>
                                <ol style={{color:'var(--text-muted)', paddingLeft:'1.5rem', lineHeight:'1.8'}}>
                                    <li>Abre el Scanner QR en tu celular o tablet</li>
                                    <li>Permite el acceso a la cámara</li>
                                    <li>Apunta al código QR de la entrada</li>
                                    <li>Verifica que el estado sea "ACEPTADA"</li>
                                    <li>Deja pasar al asistente</li>
                                </ol>
                            </div>
                        </div>
                    )}
                    
                    {tab === 'analytics' && (
                        <AnalyticsPanel eventos={eventos} />
                    )}

                    {tab === 'solicitudes' && (
                        <>
                            <div className="form-box" style={{maxWidth:'800px', margin:'0 auto'}}>
                                <h2 style={{fontSize:'1.3rem', marginBottom:'1.5rem'}}>📋 Solicitudes de Organizador</h2>
                                {solicitudes.length === 0 ? (
                                    <p style={{textAlign:'center', color:'#888'}}>No hay solicitudes pendientes</p>
                                ) : (
                                    <div style={{display:'flex', flexDirection:'column', gap:'1rem'}}>
                                        {solicitudes.map(sol => (
                                            <div key={sol.id} style={{background:'rgba(255,255,255,0.05)', padding:'1.25rem', borderRadius:'12px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'1rem'}}>
                                                <div>
                                                    <div style={{fontWeight:'bold', fontSize:'1.1rem'}}>{sol.nombre} {sol.apellido}</div>
                                                    <div style={{color:'#888', fontSize:'0.9rem'}}>{sol.email}</div>
                                                    <div style={{color:'#666', fontSize:'0.8rem', marginTop:'0.25rem'}}>Estado: <span style={{color: sol.estado === 'pendiente' ? '#ffc107' : sol.estado === 'aprobado' ? '#4caf50' : '#f44336'}}>{sol.estado}</span> • Fecha: {sol.created_at ? parseFecha(sol.created_at).toLocaleDateString('es-AR') : 'N/A'}</div>
                                                </div>
                                                {sol.estado === 'pendiente' && (
                                                    <div style={{display:'flex', gap:'0.5rem'}}>
                                                        <button onClick={() => aprobarSolicitud(sol.id)} style={{background:'#4caf50', color:'white', border:'none', padding:'0.6rem 1.2rem', borderRadius:'8px', cursor:'pointer', fontWeight:'600'}}>✅ Aprobar</button>
                                                        <button onClick={() => rechazarSolicitud(sol.id)} style={{background:'#f44336', color:'white', border:'none', padding:'0.6rem 1.2rem', borderRadius:'8px', cursor:'pointer', fontWeight:'600'}}>❌ Rechazar</button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <button onClick={cargarSolicitudes} className="btn" style={{marginTop:'1rem'}}>🔄 Actualizar</button>
                            </div>
                        </>
                    )}
                    
                    {tab === 'analytics' && user && user.rol === 'admin' && (
                    <div className="form-box" style={{marginTop:'2rem', maxWidth:'700px', marginLeft:'auto', marginRight:'auto'}}>
                        <h2 style={{fontSize:'1.2rem', marginBottom:'1rem', textAlign:'center'}}>📊 Estadísticas</h2>
                        <div style={{display:'flex', flexWrap:'wrap', gap:'1rem', justifyContent:'center'}}>
                            <div style={{background:'rgba(99,102,241,0.2)', padding:'1rem', borderRadius:'12px', textAlign:'center', minWidth:'120px', flex:'1 1 120px'}}>
                                <div style={{fontSize:'1.8rem', fontWeight:'bold', color:'var(--primary-light)'}}>{eventos.length}</div>
                                <div style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Eventos</div>
                            </div>
                            <div style={{background:'rgba(16,185,129,0.2)', padding:'1rem', borderRadius:'12px', textAlign:'center', minWidth:'120px', flex:'1 1 120px'}}>
                                <div style={{fontSize:'1.8rem', fontWeight:'bold', color:'var(--success)'}}>{eventos.reduce((a, e) => a + (e.capacidad - e.disponibles), 0).toLocaleString('es-AR')}</div>
                                <div style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Vendidas</div>
                            </div>
                            <div style={{background:'rgba(236,72,153,0.2)', padding:'1rem', borderRadius:'12px', textAlign:'center', minWidth:'120px', flex:'1 1 120px'}}>
                                <div style={{fontSize:'1.2rem', fontWeight:'bold', color:'var(--secondary)'}}>${(eventos.reduce((a, e) => a + (e.precio * (e.capacidad - e.disponibles)), 0) / 1000000).toFixed(1)}M</div>
                                <div style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Ingresos</div>
                            </div>
                            <div style={{background:'rgba(245,158,11,0.2)', padding:'1rem', borderRadius:'12px', textAlign:'center', minWidth:'120px', flex:'1 1 120px'}}>
                                <div style={{fontSize:'1.8rem', fontWeight:'bold', color:'var(--warning)'}}>{eventos.filter(e => e.disponibles < 50).length}</div>
                                <div style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Por Agotar</div>
                            </div>
                        </div>
                    </div>
                    )}
                    <div style={{textAlign:'center', padding:'2rem', color:'var(--text-dim)', fontSize:'0.8rem', borderTop:'1px solid rgba(99,102,241,0.1)', marginTop:'2rem'}}>
                        <a href="/privacidad.html" style={{color:'var(--text-dim)', textDecoration:'none'}}>Política de Privacidad</a>
                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
