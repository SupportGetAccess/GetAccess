        function ResetPassword({ setVista }) {
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState(false);
            const [showToast, setShowToast] = useState(null);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                
                if (password !== confirmPassword) {
                    setError('Las contraseñas no coinciden');
                    return;
                }
                
                if (password.length < 8) {
                    setError('La contraseña debe tener al menos 8 caracteres');
                    return;
                }
                
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('reset');
                
                if (!token) {
                    setError('Token inválido');
                    return;
                }
                
                setLoading(true);
                try {
                    const res = await fetch(API_URL + '/api/auth/restablecer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, nueva_password: password })
                    });
                    const data = await res.json();
                    
                    if (res.ok) {
                        setSuccess(true);
                        window.history.replaceState({}, '', '/');
                    } else {
                        setError(data.detail || 'Error al restablecer contraseña');
                    }
                } catch (err) {
                    setError('Error de conexión');
                }
                setLoading(false);
            };
            
            if (success) {
                return (
                    <div className="form-page">
                        <div className="form-box" style={{textAlign:'center'}}>
                            <div style={{fontSize:'4rem', marginBottom:'1rem'}}>✅</div>
                            <h2>¡Contraseña Restablecida!</h2>
                            <p style={{color:'var(--text-muted)', marginBottom:'1.5rem'}}>Tu contraseña fue cambiada exitosamente. Ya podés iniciar sesión.</p>
                            <button className="btn" onClick={() => setVista('login')}>Ir al Login</button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="form-page">
                    <div className="form-box">
                        <h2>🔐 Nueva Contraseña</h2>
                        <p style={{color:'var(--text-muted)', marginBottom:'1.5rem'}}>Ingresá tu nueva contraseña.</p>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group"><label>🔑 Nueva Contraseña</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} required /></div>
                            <div className="form-group"><label>🔑 Confirmar Contraseña</label><input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required /></div>
                            <small style={{color:'#666', fontSize:'12px', display:'block', marginBottom:'1rem'}}>Mín: 8 caracteres, 1 mayúscula, 1 minúscula, 1 número, 1 especial (!@#$%...)</small>

                            <button type="submit" className="btn btn-block" disabled={loading}>{loading ? 'Guardando...' : 'Guardar Contraseña'}</button>
                        </form>
                    </div>
                </div>
            );
        }

                if (user) {
                    setForm({ ...form, nombre: user.nombre, apellido: user.apellido, email: user.email });
                }

                if (perfilTab === 'organizer' && token) {
                    cargarEstadoSolicitud();
                }
            }, [perfilTab, token]);

            const cargarEstadoSolicitud = async () => {
                if (!token) return;
                try {
                    const res = await fetch(API_URL + '/api/auth/mi-solicitud-organizer', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setSolicitudEstado(data);
                    }
                } catch (err) { console.error(err); }
            };

            const confirmarSolicitud = async () => {
                setMostrarModalConfirmacion(false);
                if (!token) { showToast('Iniciá sesión primero', 'error'); return; }
                setSolicitando(true);
                try {
                    const res = await fetch(API_URL + '/api/auth/solicitar-organizer', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast(data.message || 'Solicitud enviada', 'success');
                        cargarEstadoSolicitud();
                    } else {
                        showToast(data.detail || 'Error', 'error');
                    }
                } catch (err) {
                    showToast('Error de conexión', 'error');
                }
                setSolicitando(false);
            };

            

            const handleChange = (e) => {
                setForm({ ...form, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (form.password_nuevo || form.confirmar_password) {
                    if (form.password_nuevo !== form.confirmar_password) {
                        showToast('Las contraseñas no coinciden', 'error');
                        return;
                    }
                }

                setGuardando(true);

                const dataToSend = {
                    nombre: form.nombre,
                    apellido: form.apellido
                };

                if (form.email !== user.email) {
                    dataToSend.email = form.email;
                }

                if (form.password_nuevo) {
                    dataToSend.password_actual = form.password_actual;
                    dataToSend.password_nuevo = form.password_nuevo;
                }

                try {
                    console.log('Enviando perfil:', dataToSend);
                    console.log('Token:', token);
                    const res = await fetch(API_URL + '/api/auth/perfil', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify(dataToSend)
                    });
                    console.log('Response:', res.status);
                    const data = await res.json();
                    console.log('Data:', data);
                    
                    if (res.ok) {
                        showToast('Perfil actualizado correctamente', 'success');
                        setUser({ ...user, nombre: data.nombre, apellido: data.apellido, email: data.email });
                        setForm({ ...form, password_actual: '', password_nuevo: '', confirmar_password: '' });
                        setVista('eventos');
                    } else {
                        showToast(data.detail || 'Error al actualizar', 'error');
                    }
                } catch (err) {
                    console.error('Error:', err);
                    showToast('Error de conexión', 'error');
                }
                setGuardando(false);
            };

            return (
                <>
                    <div className="hero">
                        <h1>👤 Mi Perfil</h1>
                        <p>Gestiona tu información personal</p>
                    </div>
                    
                    <div style={{display:'flex', gap:'0.5rem', marginBottom:'1.5rem', flexWrap:'wrap'}}>
                        <button onClick={() => setPerfilTab('datos')} style={{background: perfilTab === 'datos' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: perfilTab === 'datos' ? 'var(--glow)' : 'none'}}>👤 Datos Personales</button>
                        <button onClick={() => setPerfilTab('organizer')} style={{background: perfilTab === 'organizer' ? 'var(--gradient)' : 'rgba(255,255,255,0.1)', border:'none', color:'white', padding:'0.8rem 1.5rem', borderRadius:'12px', cursor:'pointer', fontWeight:'600', boxShadow: perfilTab === 'organizer' ? 'var(--glow)' : 'none'}}>🎪 Organizador</button>
                    </div>

                    {perfilTab === 'datos' && (
                        <div className="form-page">
                            <div className="form-box" style={{maxWidth: '500px'}}>
                                <h2>👤 Datos Personales</h2>
                                <form onSubmit={handleSubmit}>
                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem'}}>
                                        <div className="form-group"><label>👤 Nombre</label><input type="text" name="nombre" value={form.nombre} onChange={handleChange} required /></div>
                                        <div className="form-group"><label>👤 Apellido</label><input type="text" name="apellido" value={form.apellido} onChange={handleChange} required /></div>
                                    </div>
                                    <div className="form-group"><label>📧 Email</label><input type="email" name="email" value={form.email} onChange={handleChange} required /></div>
                                    
                                    <hr style={{border:'none', borderTop:'1px solid rgba(255,255,255,0.1)', margin:'1.5rem 0'}} />
                                    <h3 style={{marginBottom:'1rem', color:'#94a3b8'}}>🔐 Cambiar Contraseña</h3>
                                    <small style={{color:'#666', fontSize:'12px', display:'block', marginBottom:'1rem'}}>Dejar vacío para mantener la contraseña actual</small>
                                    
                                    <div className="form-group"><label>🔑 Contraseña Actual</label><input type="password" name="password_actual" value={form.password_actual} onChange={handleChange} placeholder="Ingresa tu contraseña actual" /></div>
                                    <div className="form-group"><label>🔑 Nueva Contraseña</label><input type="password" name="password_nuevo" value={form.password_nuevo} onChange={handleChange} placeholder="Mínimo 8 caracteres, 1 mayúscula, 1 número, 1 especial" /></div>
                                    <div className="form-group"><label>🔑 Confirmar Nueva Contraseña</label><input type="password" name="confirmar_password" value={form.confirmar_password} onChange={handleChange} placeholder="Repite la nueva contraseña" /></div>

                                    <button type="submit" className="btn btn-block" disabled={guardando}>
                                        {guardando ? 'Guardando...' : '💾 Guardar Cambios'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {perfilTab === 'organizer' && (
                        <div className="form-page">
                            <div className="form-box" style={{maxWidth: '500px'}}>
                                <h2>🎪 Organizador</h2>
                                
                                {user && user.rol === 'organizer' && (
                                    <div style={{textAlign:'center', padding:'1rem', background:'rgba(76,175,80,0.1)', borderRadius:'8px', border:'1px solid rgba(76,175,80,0.3)', marginBottom:'1rem'}}>
                                        <h3 style={{marginBottom:'0.5rem', color:'#4caf50'}}>✅ Ya eres Organizador</h3>
                                        <p style={{fontSize:'14px', color:'#888'}}>Podés crear eventos desde el menú "Crear Evento"</p>
                                    </div>
                                )}
                                
                                {user && user.rol === 'admin' && (
                                    <div style={{textAlign:'center', padding:'1rem', background:'rgba(156,39,176,0.1)', borderRadius:'8px', border:'1px solid rgba(156,39,176,0.3)', marginBottom:'1rem'}}>
                                        <h3 style={{marginBottom:'0.5rem', color:'#9c27b0'}}>⚠️ Eres Administrador</h3>
                                        <p style={{fontSize:'14px', color:'#888'}}>Tenés acceso completo al panel de administración</p>
                                    </div>
                                )}
                                
                                {user && (!user.rol || user.rol === 'usuario') && (
                                    <>
                                        {solicitudEstado && solicitudEstado.hay_solicitud && (
                                            <div style={{textAlign:'center', padding:'1rem', background: solicitudEstado.estado === 'pendiente' ? 'rgba(255,193,7,0.1)' : solicitudEstado.estado === 'aprobado' ? 'rgba(76,175,80,0.1)' : 'rgba(244,67,54,0.1)', borderRadius:'8px', border:'1px solid ' + (solicitudEstado.estado === 'pendiente' ? 'rgba(255,193,7,0.3)' : solicitudEstado.estado === 'aprobado' ? 'rgba(76,175,80,0.3)' : 'rgba(244,67,54,0.3)'), marginBottom:'1rem'}}>
                                                <h3 style={{marginBottom:'0.5rem', color: solicitudEstado.estado === 'pendiente' ? '#ffc107' : solicitudEstado.estado === 'aprobado' ? '#4caf50' : '#f44336'}}>
                                                    {solicitudEstado.estado === 'pendiente' ? '⏳ Solicitud Pendiente' : solicitudEstado.estado === 'aprobado' ? '✅ Solicitud Aprobada' : '❌ Solicitud Rechazada'}
                                                </h3>
                                                {solicitudEstado.estado === 'rechazado' && solicitudEstado.motivo_rechazo && (
                                                    <p style={{fontSize:'14px', color:'#f44336', marginTop:'0.5rem'}}>Motivo: {solicitudEstado.motivo_rechazo}</p>
                                                )}
                                                {solicitudEstado.estado === 'pendiente' && (
                                                    <p style={{fontSize:'14px', color:'#888'}}>Esperá a que un administrador revise tu solicitud</p>
                                                )}
                                                {solicitudEstado.estado === 'aprobado' && (
                                                    <p style={{fontSize:'14px', color:'#888'}}>Ya podés crear eventos desde el menú "Crear Evento"</p>
                                                )}
                                            </div>
                                        )}
                                        
                                        <div style={{textAlign:'center', padding:'1rem', background:'rgba(255,193,7,0.1)', borderRadius:'8px', border:'1px solid rgba(255,193,7,0.3)'}}>
                                            <h3 style={{marginBottom:'0.5rem', color:'#ffc107'}}>🎪 ¿Querés crear eventos?</h3>
                                            <p style={{fontSize:'14px', color:'#888', marginBottom:'1rem'}}>Solicitá ser organizador y podrás crear tus propios eventos</p>
                                            <button 
                                                type="button" 
                                                className="btn btn-block"
                                                style={{background:'#ffc107', color:'#000', fontWeight:'bold'}}
                                                onClick={() => setMostrarModalConfirmacion(true)}
                                                disabled={solicitando || (solicitudEstado && solicitudEstado.hay_solicitud && solicitudEstado.estado === 'pendiente')}
                                            >
                                                {solicitando ? 'Enviando...' : '📝 Solicitar ser organizador de eventos'}
                                            </button>
                                        </div>
                                        
                                        {mostrarModalConfirmacion && (
                                            <div style={{position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.8)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000}} onClick={() => setMostrarModalConfirmacion(false)}>
                                                <div style={{background:'#1e1e2e', padding:'2rem', borderRadius:'16px', maxWidth:'400px', textAlign:'center'}} onClick={e => e.stopPropagation()}>
                                                    <h3 style={{marginBottom:'1rem'}}>⚠️ Confirmar Solicitud</h3>
                                                    <p style={{color:'#ccc', marginBottom:'1.5rem'}}>¿Estás seguro que deseas solicitar ser organizador de eventos?</p>
                                                    <div style={{display:'flex', gap:'1rem', justifyContent:'center'}}>
                                                        <button 
                                                            type="button"
                                                            onClick={() => confirmarSolicitud()}
                                                            style={{background:'#4caf50', color:'white', border:'none', padding:'0.8rem 1.5rem', borderRadius:'8px', cursor:'pointer', fontWeight:'600'}}
                                                        >
                                                            ✅ Aceptar
                                                        </button>
                                                        <button 
                                                            type="button"
                                                            onClick={() => setMostrarModalConfirmacion(false)}
                                                            style={{background:'#f44336', color:'white', border:'none', padding:'0.8rem 1.5rem', borderRadius:'8px', cursor:'pointer', fontWeight:'600'}}
                                                        >
                                                            ❌ Cancelar
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        function Carrito() {
            const { token, showToast, setVista, setCarrito: setCarritoGlobal } = useContext(AuthContext);
            const [procesando, setProcesando] = useState(false);
            const [carrito, setCarrito] = useState([]);
            
            const parseFecha = (fecha) => {
                if (!fecha) return new Date(0);
                if (fecha.includes(' ') && fecha.match(/\d{2}:\d{2}:\d{2}/)) {
                    return new Date(fecha.replace(' ', 'T'));
                }
                return new Date(fecha + 'T12:00:00');
            };
            
            useEffect(() => {
                const stored = JSON.parse(localStorage.getItem('carrito') || '[]');
                setCarrito(stored);
            }, []);
            
            const eliminarDelCarrito = (eventoId) => {
                const nuevo = carrito.filter(c => c.id !== eventoId);
                setCarrito(nuevo);
                localStorage.setItem('carrito', JSON.stringify(nuevo));
            };
            
            const total = carrito.reduce((sum, e) => {
                const precioBase = e.precio;
                const comision = e.comision || 0;
                const precioConComision = precioBase * (1 + comision / 100);
                return sum + (precioConComision * (e.cantidad || 1));
            }, 0);
            
            const [metodoPago, setMetodoPago] = useState('qr');  // 'qr' o 'link'
            const [qrData, setQrData] = useState(null);
            const [qrTimer, setQrTimer] = useState(null);
            const [qrCountdown, setQrCountdown] = useState(300);
            const [verificarPagoTimer, setVerificarPagoTimer] = useState(null);
            const [pagoExitoso, setPagoExitoso] = useState(false);
            
            // Datos del comprador (para compra sin registro)
            const [datosComprador, setDatosComprador] = useState({
                nombre: '', apellido: '', email: '', email_confirm: '', telefono: ''
            });
            const [erroresComprador, setErroresComprador] = useState({});
            
            const validarDatosComprador = () => {
                const errores = {};
                if (!datosComprador.nombre || datosComprador.nombre.length < 2) {
                    errores.nombre = 'El nombre debe tener al menos 2 caracteres';
                }
                if (!datosComprador.apellido || datosComprador.apellido.length < 2) {
                    errores.apellido = 'El apellido debe tener al menos 2 caracteres';
                }
                if (!datosComprador.email || !datosComprador.email.includes('@')) {
                    errores.email = 'Ingresa un email válido';
                }
                if (datosComprador.email !== datosComprador.email_confirm) {
                    errores.email_confirm = 'Los emails no coinciden';
                }
                if (!datosComprador.telefono || !/^\d{8,15}$/.test(datosComprador.telefono)) {
                    errores.telefono = 'El teléfono debe tener entre 8 y 15 dígitos';
                }
                setErroresComprador(errores);
                return Object.keys(errores).length === 0;
            };
            
            // useEffect para verificar automáticamente el estado del pago QR
            useEffect(() => {
                if (!qrData?.qr_order_id || pagoExitoso) return;
                
                console.log('>>> [DEBUG] Iniciando verificación automática de pago QR:', qrData.qr_order_id);
                
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch(API_URL + '/api/pagos/qr/' + qrData.qr_order_id + '/status');
                        const status = await res.json();
                        console.log('>>> [DEBUG] Estado del QR:', status);
                        
                        if (status.estado === 'pagada') {
                            console.log('>>> [DEBUG] ¡Pago detectado! Mostrando modal de éxito');
                            clearInterval(interval);
                            setPagoExitoso(true);
                            if (verificarPagoTimer) clearInterval(verificarPagoTimer);
                        }
                    } catch (err) {
                        console.error('>>> [DEBUG] Error al verificar pago:', err);
                    }
                }, 3000);
                
                return () => {
                    console.log('>>> [DEBUG] Limpiando intervalo de verificación');
                    clearInterval(interval);
                };
            }, [qrData?.qr_order_id, pagoExitoso]);
            
            const formatCountdown = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };
            
            const pagarTodo = async () => {
                if (carrito.length === 0) return;
                setProcesando(true);
                setErroresComprador({});
                try {
                    // Si no hay token, usar endpoints de invitado
                    if (!token) {
                        if (!validarDatosComprador()) {
                            setProcesando(false);
                            return;
                        }
                        // Usar endpoints /invitado
                        const entradas = carrito.map(item => ({
                            evento_id: item.id,
                            cantidad: item.cantidad || 1
                        }));
                        const endpoint = metodoPago === 'qr' 
                            ? '/api/pagos/qr/invitado' 
                            : '/api/pagos/carrito/invitado';
                        
                        const res = await fetch(API_URL + endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                entradas: entradas,
                                comprador: datosComprador
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.detail || 'Error al procesar');
                        
                        if (metodoPago === 'qr') {
                            if (data.qr_code) {
                                setQrData(data);
                                setQrCountdown(600);
                                setProcesando(false);
                                const interval = setInterval(() => {
                                    setQrCountdown(prev => {
                                        if (prev <= 1) {
                                            clearInterval(interval);
                                            if (data.qr_order_id) {
                                                fetch(API_URL + '/api/pagos/qr/' + data.qr_order_id + '/cancelar', {
                                                    method: 'POST'
                                                }).catch(e => console.error('Error al eliminar entradas:', e));
                                            }
                                            cerrarQrModal();
                                            showToast('Tu tiempo de espera ha finalizado. Las entradas fueron liberadas.', 'error');
                                            setVista('eventos');
                                            return 0;
                                        }
                                        return prev - 1;
                                    });
                                }, 1000);
                                setQrTimer(interval);
                                return;
                            } else {
                                showToast(data.detail || 'Error al generar QR', 'error');
                            }
                        } else {
                            if (data.init_point) {
                                localStorage.removeItem('carrito');
                                showToast('Redirigiendo a MercadoPago...', 'success');
                                window.location.href = data.init_point;
                            } else {
                                showToast(data.detail || 'Error al procesar pago', 'error');
                            }
                        }
                    } else {
                        // Usuario logueado - usar endpoints con auth
                        const entradaIds = [];
                        for (const item of carrito) {
                            const res = await fetch(API_URL + '/api/entradas/', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                body: JSON.stringify({ evento_id: item.id, cantidad: item.cantidad || 1 })
                            });
                            if (!res.ok) throw new Error('Error al comprar ' + item.nombre);
                            const entrada = await res.json();
                            entradaIds.push(entrada.id);
                        }
                        
                        if (metodoPago === 'qr') {
                            const qrRes = await fetch(API_URL + '/api/pagos/qr', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                body: JSON.stringify({ entrada_ids: entradaIds })
                            });
                            const qr = await qrRes.json();
                            if (qrRes.ok && qr.qr_code) {
                                setQrData(qr);
                                setQrCountdown(600);
                                setProcesando(false);
                                const interval = setInterval(() => {
                                    setQrCountdown(prev => {
                                        if (prev <= 1) {
                                            clearInterval(interval);
                                            if (qr.qr_order_id) {
                                                fetch(API_URL + '/api/pagos/qr/' + qr.qr_order_id + '/cancelar', {
                                                    method: 'POST',
                                                    headers: { 'Authorization': 'Bearer ' + token }
                                                }).catch(e => console.error('Error al eliminar entradas:', e));
                                            }
                                            cerrarQrModal();
                                            showToast('Tu tiempo de espera ha finalizado. Las entradas fueron liberadas.', 'error');
                                            setVista('eventos');
                                            return 0;
                                        }
                                        return prev - 1;
                                    });
                                }, 1000);
                                setQrTimer(interval);
                                return;
                            } else {
                                showToast(qr.detail || 'Error al generar QR', 'error');
                            }
                        } else {
                            const pagoRes = await fetch(API_URL + '/api/pagos/carrito', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                body: JSON.stringify({ entrada_ids: entradaIds })
                            });
                            const pago = await pagoRes.json();
                            
                            if (pagoRes.ok && pago.init_point) {
                                localStorage.removeItem('carrito');
                                showToast('Redirigiendo a MercadoPago...', 'success');
                                window.location.href = pago.init_point;
                            } else {
                                showToast(pago.detail || 'Error al procesar pago', 'error');
                            }
                        }
                    }
                } catch (err) { showToast(err.message, 'error'); }
                setProcesando(false);
            };
            
            const cerrarQrModal = () => {
                if (qrTimer) clearInterval(qrTimer);
                if (verificarPagoTimer) clearInterval(verificarPagoTimer);
                setQrData(null);
                setProcesando(false);
                setPagoExitoso(false);
            };
            
            const cancelarQr = async () => {
                if (qrTimer) clearInterval(qrTimer);
                if (verificarPagoTimer) clearInterval(verificarPagoTimer);
                if (qrData?.qr_order_id) {
                    try {
                        await fetch(API_URL + '/api/pagos/qr/' + qrData.qr_order_id + '/cancelar', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                    } catch (e) { console.error(e); }
                }
                localStorage.removeItem('carrito');
                setCarrito([]);
                cerrarQrModal();
                showToast('Compra cancelada', 'error');
                setVista('eventos');
            };
            
            const redirigirAMisEntradas = () => {
                localStorage.removeItem('carrito');
                setCarrito([]);
                cerrarQrModal();
                setVista('mis-entradas');
            };
            
            const verificarPagoQr = async () => {
                if (!qrData) return;
                try {
                    const res = await fetch(API_URL + '/api/pagos/qr/' + qrData.qr_order_id + '/status');
                    const status = await res.json();
                    if (status.estado === 'pagada') {
                        if (verificarPagoTimer) clearInterval(verificarPagoTimer);
                        setPagoExitoso(true);
                    }
                } catch (err) { console.error(err); }
            };
            
            if (carrito.length === 0) {
                return (
                    <div className="hero"><h1>🛒 Carrito</h1></div>,
                    <div className="empty-state"><span>🛒</span><p>Tu carrito está vacío</p><button className="btn" onClick={() => setVista('eventos')}>Ver Eventos</button></div>
                );
            }
            
            return (
                <>
                    <div className="hero"><h1>🛒 Carrito de Compras</h1><p>{carrito.length} entrada(s) en tu carrito</p></div>
                    <div style={{maxWidth: '800px', margin: '0 auto', padding: '1rem'}}>
                        <div className="entradas-list">
                            {carrito.map((item, index) => {
                                const precioBase = item.precio;
                                const comision = item.comision || 0;
                                const precioConComision = precioBase * (1 + comision / 100);
                                return (
                                <div key={index} className="entrada-card">
                                    <div className="entrada-info">
                                        <h4>🎪 {item.nombre}</h4>
                                        <p>📅 {parseFecha(item.fecha).toLocaleDateString('es-AR')}</p>
                                        <p>📍 {item.lugar}</p>
                                        <p>🎟️ Cantidad: {item.cantidad || 1}</p>
                                        {comision > 0 && <p>💼 Cargo por servicios: ${((precioConComision - precioBase) * (item.cantidad || 1)).toLocaleString('es-AR')}</p>}
                                        <p>💵 Subtotal: ${(precioBase * (item.cantidad || 1)).toLocaleString('es-AR')}</p>
                                    </div>
                                    <button className="btn btn-secondary" onClick={() => eliminarDelCarrito(item.id)}>❌</button>
                                </div>
                            )})}
                        </div>
                        <div className="modal-total" style={{marginTop: '1rem', padding: '1rem', background: 'linear-gradient(135deg, #6366f1, #ec4899)', borderRadius: '12px', color: 'white'}}>
                            💵 Total: ${total.toLocaleString('es-AR')}
                        </div>
                        {!token && (
                        <div style={{marginTop: '1rem', padding: '1rem', background: '#f8fafc', borderRadius: '12px', border: '2px solid #6366f1'}}>
                            <h4 style={{marginBottom: '1rem', color: '#1f2937'}}>📝 Datos del Comprador</h4>
                            <div style={{display: 'grid', gap: '0.75rem'}}>
                                <div>
                                    <input type="text" placeholder="Nombre" value={datosComprador.nombre} 
                                        onChange={e => setDatosComprador({...datosComprador, nombre: e.target.value})} 
                                        style={{width: '100%', padding: '0.75rem', borderRadius: '8px', border: erroresComprador.nombre ? '2px solid #ef4444' : '1px solid #ddd'}} />
                                    {erroresComprador.nombre && <span style={{color: '#ef4444', fontSize: '12px'}}>{erroresComprador.nombre}</span>}
                                </div>
                                <div>
                                    <input type="text" placeholder="Apellido" value={datosComprador.apellido}

        function BuscarEntradas() {
            const [busqueda, setBusqueda] = useState('');
            const [resultados, setResultados] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const { showToast } = useContext(AuthContext);
            const [enviando, setEnviando] = useState(null);

            const buscar = async () => {
                if (!busqueda || busqueda.length < 3) {
                    showToast('Ingresa al menos 3 caracteres', 'error');
                    return;
                }
                setLoading(true);
                setError(null);
                setResultados(null);
                try {
                    const res = await fetch(API_URL + '/api/entradas/buscar?q=' + encodeURIComponent(busqueda));
                    if (!res.ok) throw new Error('No se encontraron entradas');
                    const data = await res.json();
                    setResultados(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const reenviarTicket = async (entradaId, email) => {
                setEnviando(entradaId);
                try {
                    const res = await fetch(API_URL + `/api/email/reenviar-ticket?entrada_id=${entradaId}&email=${encodeURIComponent(email)}`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast('📧 Ticket enviado a tu email', 'success');
                    } else {
                        showToast(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || 'Error al enviar'), 'error');
                    }
                } catch (err) {
                    showToast('Error al enviar', 'error');
                } finally {
                    setEnviando(null);
                }
            };

            return (
                <>
                    <div className="hero">
                        <h1>🔍 Buscar Mis Entradas</h1>
                        <p>¿Perdiste tus entradas? Búscalas por email o documento</p>
                    </div>
                    <div style={{maxWidth: '600px', margin: '0 auto', padding: '1rem'}}>
                        <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1.5rem'}}>
                            <input 
                                type="text" 
                                value={busqueda} 
                                onChange={e => setBusqueda(e.target.value)} 
                                placeholder="Tu email o DNI"
                                style={{flex: 1, padding: '14px', borderRadius: '8px', border: '2px solid #6366f1', fontSize: '16px'}}
                                onKeyDown={e => e.key === 'Enter' && buscar()}
                            />
                            <button className="btn" onClick={buscar} disabled={loading}>
                                {loading ? 'Buscando...' : '🔍'}
                            </button>
                        </div>

                        {error && (
                            <div className="empty-state">
                                <span>❌</span>
                                <p>{error}</p>
                                <p style={{fontSize: '0.9rem', opacity: 0.7}}>Verifica tu email o documento e intenta nuevamente</p>
                            </div>
                        )}

                        {resultados && resultados.length > 0 && (
                            <div className="entradas-list">
                                <h3 style={{marginBottom: '1rem'}}>🎟️ Se encontraron {resultados.length} entrada(s)</h3>
                                {resultados.map(ent => (
                                    <div key={ent.id} className="entrada-card">
                                        <div className="entrada-info">
                                            <h4>🎪 {ent.evento?.nombre || 'Evento'}</h4>
<p>📅 {ent.evento ? parseFecha(ent.evento.fecha).toLocaleDateString('es-AR') : ''}</p>
                                            <p>📍 {ent.evento?.lugar || ''}</p>
                                            <p>🎟️ Cantidad: {ent.cantidad} - 💵 Total: ${ent.total?.toLocaleString('es-AR')}</p>
                                            <span className={ent.estado === 'pagada' ? 'entrada-pagada' : 'entrada-pendiente'}>
                                                {ent.estado === 'pagada' ? '✅ Pagada' : '⏳ Pendiente'}
                                            </span>
                                        </div>
                                        <div style={{marginTop: '1rem'}}>
                                            <button 
                                                className="btn" 
                                                style={{background: '#10b981', width: '100%'}}
                                                onClick={() => reenviarTicket(ent.id, ent.email)}
                                                disabled={enviando === ent.id}
                                            >
                                                {enviando === ent.id ? 'Enviando...' : '📧 Reenviar a mi email'}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </>
            );
        }

        function MisEntradas() {
            const [entradas, setEntradas] = useState([]);
            const [loading, setLoading] = useState(true);
            const { showToast } = useContext(AuthContext);
            const [transferenciasPendientes, setTransferenciasPendientes] = useState([]);
            
            const parseFecha = (fecha) => {
                if (!fecha) return new Date(0);
                if (fecha.includes(' ') && fecha.match(/\d{2}:\d{2}:\d{2}/)) {
                    return new Date(fecha.replace(' ', 'T'));
                }
                return new Date(fecha + 'T12:00:00');
            };
            
            useEffect(() => {
                const savedToken = sessionStorage.getItem('token');
                if (savedToken) {
                    fetch(API_URL + '/api/entradas/', { headers: { Authorization: 'Bearer ' + savedToken } })
                    .then(res => res.ok ? res.json() : [])
                    .then(data => setEntradas(Array.isArray(data) ? data : []))
                    .catch(() => setEntradas([]))
                    .finally(() => setLoading(false));
                    
                    const tr1 = savedToken + 't1';
                    fetch(API_URL + '/api/transferencias/pendientes', { headers: { Authorization: 'Bearer ' + savedToken } })
                    .then(res => { 
                        if (!res.ok) return []; 
                        return res.json(); 
                    })
                    .then(data => {
                        console.log('Transferencias data:', data);
                        setTransferenciasPendientes(Array.isArray(data) ? data : []);
                    })
                    .catch(err => {
                        console.log('Transferencias error (ignorado):', err);
                        setTransferenciasPendientes([]);
                    });
                } else {
                    setLoading(false);
                }
            }, []);
            
            const enviarTicket = async (entradaId) => {
                const savedToken = sessionStorage.getItem('token');
                const res = await fetch(API_URL + '/api/email/enviar-ticket?entrada_id=' + entradaId, { method: 'POST', headers: { Authorization: 'Bearer ' + savedToken } });
                const data = await res.json();
                if (res.ok) showToast('Ticket enviado a ' + data.email, 'success');
                else showToast(data.detail || 'Error', 'error');
            };
            
            const [transferModal, setTransferModal] = useState(null);
            const [transferEmail, setTransferEmail] = useState('');
            const [transferring, setTransferring] = useState(false);
            const [confirmTransfer, setConfirmTransfer] = useState(false);
            
            const transferirEntrada = async () => {
                if (!transferEmail || !transferEmail.includes('@')) {
                    showToast('Ingresa un email válido', 'error');
                    return;
                }
                setTransferring(true);
                try {
                    const res = await fetch(API_URL + '/api/entradas/' + transferModal.id + '/transferir', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                        body: JSON.stringify({ email_destino: transferEmail })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast('Transferencia iniciada. Se envió un email al destinatario.', 'success');
                        setTransferModal(null);
                        setTransferEmail('');
                    } else {
                        showToast(data.detail || 'Error al transferir', 'error');
                    }
                } catch (e) {
                    showToast('Error de conexión', 'error');
                }
                setTransferring(false);
            };
            
            const [acceptToken, setAcceptToken] = useState('');
            const [accepting, setAccepting] = useState(false);
            
            const aceptarTransferencia = async () => {
                if (!acceptToken) {
                    showToast('Ingresa el código de transferencia', 'error');
                    return;
                }
                setAccepting(true);
                try {
                    const res = await fetch(API_URL + '/api/entradas/aceptar-transferencia?token=' + acceptToken, {
                        method: 'POST',
                        headers: { Authorization: 'Bearer ' + token }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast(data.mensaje, 'success');
                        setAcceptToken('');
                        fetch(API_URL + '/api/entradas/', { headers: { Authorization: 'Bearer ' + token } }).then(res => res.json()).then(data => setEntradas(data));
                    } else {
                        showToast(data.detail || 'Error al aceptar', 'error');
                    }
                } catch (e) {
                    showToast('Error de conexión', 'error');
                }
                setAccepting(false);
            };
            if (loading) return <div className="loading">Cargando...</div>;
            return (
                <>
                    <div className="hero">
                        <h1>🎟️ Mis Entradas</h1>
                        <p>Todas tus entradas compradas en un solo lugar</p>

                    {transferenciasPendientes && transferenciasPendientes.length > 0 && (

                                <div>
                                    <h3 style={{margin: 0, fontSize: '1.1rem'}}>📥 Tienes {transferenciasPendientes.length} Transferencia(s) de entrada(s) por aceptar</h3>

                                </div>
                                <button className="btn" style={{background: 'white', color: '#f59e0b', fontWeight: 'bold'}} onClick={() => setVista('aceptar-transferencia')}>Aceptar</button>
                            </div>
                        </div>
                    )}
                    {entradas.length === 0 ? (
                        <div className="empty-state">
                            <span>🎫</span>
                            <p>No tienes entradas compradas</p>
                            <button className="btn" style={{marginTop: '1rem'}} onClick={() => setVista('eventos')}>Ver Eventos</button>
                        </div>
                    ) : (
                        <div className="entradas-list">
                            {entradas.map(ent => (
                                <div key={ent.id} className="entrada-card">

                                        <p>📍 {ent.evento?.lugar || ''}</p>
                                        <p>🎟️ Cantidad: {ent.cantidad} - 💵 Total: ${ent.total?.toLocaleString('es-AR')}</p>
                                    </div>
                                    <div>
                                        <div className="entrada-qr" style={{fontSize: '14px', fontFamily: 'monospace'}}>
                                            <div style={{marginBottom: '8px'}}>🎫 Código de Acceso</div>
                                            <div style={{fontSize: '16px', fontWeight: 'bold', color: '#6366f1', wordBreak: 'break-all'}}>{ent.codigo}</div>
                                        </div>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '0.5rem'}}>
                                            <button className="btn" style={{marginTop: '0.5rem'}} onClick={() => enviarTicket(ent.id)}>📧 Enviar por email</button>
                                            <button className="btn btn-secondary" style={{marginTop: '0.25rem'}} onClick={() => setTransferModal(ent)} disabled>🔄 Transferir</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    
                    {transferModal && !confirmTransfer && (
                        <div className="modal-overlay" onClick={() => setTransferModal(null)}>

                                    <p>🎪 <span>Evento:</span> {transferModal.evento?.nombre}</p>
                                    <p>🎫 <span>Código:</span> {transferModal.codigo}</p>

                                <div style={{margin: '1rem 0'}}>
                                    <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600'}}>📧 Email del destinatario:</label>
                                    <input type="email" value={transferEmail} onChange={e => setTransferEmail(e.target.value)} placeholder="amigo@email.com" style={{width: '100%', padding: '12px', borderRadius: '8px', border: '1px solid #ddd', fontSize: '14px'}} />
                                </div>
                                <p style={{fontSize: '12px', color: '#64748b', marginBottom: '1rem'}}>El destinatario recibirá un email para aceptar la transferencia.</p>
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => setTransferModal(null)}>❌ Cancelar</button>
                                    <button className="btn" onClick={() => setConfirmTransfer(true)} disabled={!transferEmail || !transferEmail.includes('@')}>✅ Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {transferModal && confirmTransfer && (
                        <div className="modal-overlay" onClick={() => { setConfirmTransfer(false); setTransferModal(null); }}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h3>⚠️ ¿Estás seguro?</h3>
                                <p style={{margin: '1rem 0', textAlign: 'center'}}>Vas a transferir esta entrada a:</p>
                                <p style={{fontSize: '18px', fontWeight: 'bold', color: '#6366f1', textAlign: 'center', margin: '1rem 0'}}>{transferEmail}</p>
                                <p style={{fontSize: '14px', color: '#64748b', textAlign: 'center'}}>Una vez transferida, ya no podrás usarla.</p>
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => { setConfirmTransfer(false); setTransferEmail(''); setTransferModal(null); }}>❌ Cancelar</button>
                                    <button className="btn" onClick={transferirEntrada} disabled={transferring}>{transferring ? 'Enviando...' : '🔥 Sí, Transferir'}</button>
                                </div>
                            </div>
                        </div>

                    <div style={{marginTop: '2rem', padding: '1.5rem', background: 'var(--card-bg)', borderRadius: '12px', opacity: 0.6}}>
