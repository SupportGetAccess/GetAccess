<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Access - Compra tus entradas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%236366f1'/%3E%3Cstop offset='100%25' style='stop-color:%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='10' y='25' width='80' height='55' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='30' cy='52' r='8' fill='white'/%3E%3Ccircle cx='70' cy='52' r='8' fill='white'/%3E%3Crect x='38' y='48' width='24' height='8' fill='white' rx='2'/%3E%3Crect x='35' y='15' width='30' height='15' rx='4' fill='url(%23g)'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { 
            --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8;
            --secondary: #ec4899; --accent: #10b981;
            --bg-dark: #1a1a2e; --bg-card: #252542; --bg-card-hover: #2f2f52;
            --text: #f8fafc; --text-muted: #94a3b8; --text-dim: #64748b;
            --success: #10b981; --error: #ef4444; --warning: #f59e0b;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --glow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
        body { 
            background: linear-gradient(180deg, #1e1e3f 0%, #16213e 50%, #1a1a35 100%); 
            min-height: 100vh; 
            color: var(--text);
            background-attachment: fixed;
        }
        header { 
            background: rgba(30, 30, 63, 0.85); 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
        }
        .logo { 
            font-size: 1.5rem; 
            font-weight: 800; 
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        nav { display: flex; gap: 0.5rem; align-items: center; }
        nav button { 
            background: transparent; 
            border: 2px solid transparent;
            color: var(--text-muted); 
            padding: 0.6rem 1.2rem; 
            cursor: pointer; 
            border-radius: 12px; 
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        nav button:hover { 
            color: var(--text);
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }
        nav button.active { 
            background: var(--gradient);
            color: white;
            box-shadow: var(--glow);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: 2rem;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            z-index: -1;
        }
        .hero h1 { 
            font-size: 2.5rem; 
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideDown 0.8s ease-out;
        }
        .hero p { color: var(--text-muted); font-size: 1.1rem; animation: fadeIn 1s ease-out 0.3s both; }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 { 
            margin-bottom: 1.5rem; 
            color: var(--text);
            font-weight: 700;
        }
        
        .eventos-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 1.5rem; 
        }
        .evento-card { 
            background: var(--bg-card); 
            border-radius: 24px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .evento-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .evento-card:hover { 
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .evento-card:hover::before { opacity: 1; }
        
        .evento-img { 
            height: 200px; 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5rem;
            position: relative;
            overflow: hidden;
        }
        .evento-img::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, var(--bg-card) 100%);
        }
        .evento-info { padding: 1.5rem; }
        .evento-info h3 { 
            margin-bottom: 0.5rem; 
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }
        .evento-meta { 
            display: flex; 
            gap: 1.5rem; 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            margin-bottom: 0.75rem;
        }
        .evento-meta span { display: flex; align-items: center; gap: 0.4rem; }
        .evento-desc { 
            color: var(--text-dim); 
            font-size: 0.9rem; 
            margin: 1rem 0; 
            line-height: 1.5;
        }
        .evento-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 1rem; 
            padding-top: 1rem; 
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .precio { 
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--success);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .disponibles { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-top: 0.25rem;
        }
        .disponibles.low { color: var(--error); }
        
        .btn { 
            background: var(--gradient); 
            color: white; 
            border: none; 
            padding: 0.9rem 1.8rem; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        .btn:disabled { 
            background: #374151; 
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-block { width: 100%; }
        
        .form-page { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 70vh; 
        }
        .form-box { 
            background: var(--bg-card); 
            padding: 2.5rem; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-box h2 { 
            margin-bottom: 1.5rem; 
            color: var(--text);
            text-align: center;
            font-size: 1.8rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-group input { 
            width: 100%; 
            padding: 1rem 1.2rem; 
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3); 
            color: white; 
            border-radius: 14px; 
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-group input:focus { 
            outline: none; 
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.8); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }
        .modal { 
            background: var(--bg-card); 
            padding: 2rem; 
            border-radius: 24px; 
            width: 90%; 
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal h3 { 
            color: var(--text); 
            margin-bottom: 1.5rem; 
            font-size: 1.5rem;
            text-align: center;
        }
        .modal-info { 
            background: rgba(0, 0, 0, 0.2); 
            border-radius: 16px; 
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .modal-info p { 
            display: flex; 
            justify-content: space-between; 
            padding: 0.6rem 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
        }
        .modal-info p:last-child { border-bottom: none; }
        .modal-info p span { color: var(--text); font-weight: 600; }
        .modal-total { 
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--success); 
            text-align: center; 
            margin: 1.5rem 0;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .modal-buttons { display: flex; gap: 1rem; }
        .modal-buttons button { flex: 1; }
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.1); 
            color: var(--text-muted);
            box-shadow: none;
        }
        .btn-secondary:hover { 
            background: rgba(255, 255, 255, 0.15);
            color: var(--text);
        }
        
        .entradas-list { 
            display: flex; 
            flex-direction: column; 
            gap: 1rem; 
        }
        .entrada-card { 
            background: var(--bg-card); 
            padding: 1.5rem; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .entrada-card:hover {
            border-color: rgba(99, 102, 241, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .entrada-info h4 { 
            color: var(--primary-light); 
            margin-bottom: 0.5rem; 
            font-size: 1.2rem;
        }
        .entrada-info p { 
            color: var(--text-muted); 
            font-size: 0.9rem;
            margin: 0.3rem 0;
        }
        .entrada-qr { 
            background: linear-gradient(135deg, #fff 0%, #e2e8f0 100%);
            color: #1e293b; 
            padding: 0.8rem 1.2rem; 
            border-radius: 12px; 
            font-family: monospace; 
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .entrada-pagada { 
            background: var(--success); 
            color: white; 
            padding: 0.4rem 1rem; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 700;
            display: inline-block;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .entrada-pendiente { 
            background: var(--warning); 
            color: white; 
            padding: 0.4rem 1rem; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 700;
            display: inline-block;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }
        
        .toast { 
            position: fixed; 
            top: 90px; 
            right: 20px; 
            padding: 1rem 1.5rem; 
            border-radius: 16px; 
            font-weight: 700; 
            z-index: 2000; 
            animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .toast.success { 
            background: var(--success); 
            color: white; 
        }
        .toast.error { 
            background: var(--error); 
            color: white; 
        }
        @keyframes slideIn { 
            from { transform: translateX(400px); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }
        
        .loading { 
            text-align: center; 
            padding: 3rem; 
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        .user-info { 
            display: flex; 
            align-items: center; 
            gap: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .user-info span { 
            color: var(--primary-light);
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .empty-state span { font-size: 4rem; display: block; margin-bottom: 1rem; }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading { animation: pulse 1.5s infinite; }
        
        .form-box textarea { font-family: 'Segoe UI', sans-serif; }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .admin-evento-card {
            display: flex !important;
            flex-direction: column !important;
        }
        .admin-evento-card > div:first-child,
        .admin-evento-card > p,
        .admin-evento-card > div:last-child {
            width: 100%;
        }
        
        @media (max-width: 768px) {
            div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
            .hero h1 { font-size: 1.8rem; }
        }
        
        /* Responsive Design - Móviles y Tablets */
        
        /* Tablets pequeñas y móviles grandes */
        @media (max-width: 900px) {
            .detalle-info { grid-template-columns: 1fr; }
            .detalle-hero { height: 280px; }
            .detalle-hero-overlay h1 { font-size: 1.8rem; }
            .detalle-sidebar { position: static; }
        }
        
        /* Móviles */
        @media (max-width: 768px) {
            /* Header */
            header {
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .logo { font-size: 1.2rem; }
            nav { 
                gap: 0.25rem; 
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            nav button {
                padding: 0.5rem 0.8rem;
                font-size: 0.75rem;
            }
            
            /* Container */
            .container { padding: 1rem; }
            
            /* Hero */
            .hero { padding: 1.5rem 0.5rem; }
            .hero h1 { 
                font-size: 1.6rem; 
                line-height: 1.2;
            }
            .hero p { font-size: 0.95rem; }
            
            /* Grid de eventos */
            .eventos-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .evento-card { border-radius: 16px; }
            .evento-img { height: 150px; }
            .evento-info { padding: 1rem; }
            .evento-info h3 { font-size: 1.1rem; }
            .evento-meta { 
                flex-direction: column; 
                gap: 0.5rem; 
                font-size: 0.8rem;
            }
            .evento-desc { 
                font-size: 0.85rem; 
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .precio { font-size: 1.5rem; }
            
            /* Botones */
            .btn {
                padding: 0.7rem 1.2rem;
                font-size: 0.9rem;
                min-height: 44px;
            }
            
            /* Formularios */
            .form-box {
                padding: 1.5rem;
                border-radius: 16px;
            }
            .form-box h2 { font-size: 1.4rem; }
            .form-group input {
                padding: 0.8rem 1rem;
                font-size: 16px;
            }
            
            /* Modal */
            .modal {
                width: 90%;
                max-width: 400px;
                padding: 1.5rem;
                margin: 1rem;
            }
            .modal h3 { font-size: 1.3rem; }
            
            /* Mis Entradas */
            .entradas-list { gap: 0.75rem; }
            .entrada-card {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }
            .entrada-info h4 { font-size: 1rem; }
            .entrada-info p { font-size: 0.85rem; }
            
            /* Detalle evento */
            .detalle-hero { 
                height: 200px; 
                border-radius: 12px;
            }
            .detalle-hero-overlay { 
                padding: 1rem; 
            }
            .detalle-hero-overlay h1 { 
                font-size: 1.4rem; 
            }
            .detalle-info { gap: 1rem; }
            .detalle-descripcion {
                padding: 1rem;
                font-size: 0.95rem;
            }
            .detalle-card { 
                padding: 1rem; 
                border-radius: 12px;
            }
            .detalle-precio { font-size: 1.8rem; }
            
            /* Carrito */
            .carrito-item {
                flex-direction: column;
                gap: 0.75rem;
            }
            .carrito-item-info { width: 100%; }
            
            /* Analíticas */
            .analytics-grid {
                grid-template-columns: 1fr;
            }
            .stat-card {
                padding: 1rem;
            }
            .stat-card .value { 
                font-size: 1.5rem; 
            }
            
            /* Buscador */
            .busqueda-container {
                flex-direction: column;
                gap: 0.75rem;
            }
            .busqueda-container input,
            .busqueda-container select,
            .busqueda-container button {
                width: 100%;
            }
            
            /* Tablas admin */
            .tabla-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .tabla-scroll table {
                font-size: 0.85rem;
                min-width: 600px;
            }
        }
        
        /* Móviles muy pequeños */
        @media (max-width: 380px) {
            .hero h1 { font-size: 1.4rem; }
            .precio { font-size: 1.3rem; }
            .detalle-hero-overlay h1 { font-size: 1.2rem; }
            .form-box { padding: 1rem; }
        }
        
        /* Tablets en horizontal */
        @media (min-width: 769px) and (max-width: 1024px) {
            .eventos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .hero h1 { font-size: 2rem; }
            .detalle-info {
                grid-template-columns: 2fr 1fr;
            }
        }
        
        /* Dispositivos táctiles - botones más grandes */
        @media (hover: none) and (pointer: coarse) {
            nav button,
            .btn,
            .form-group input,
            select {
                min-height: 44px;
            }
            .evento-card:active {
                transform: scale(0.98);
            }
            a, button {
                -webkit-tap-highlight-color: rgba(99, 102, 241, 0.3);
            }
        }
        
        /* Landscape móvil */
        @media (max-height: 500px) and (orientation: landscape) {
            .hero { padding: 1rem; }
            .hero h1 { font-size: 1.5rem; }
            .form-page { min-height: auto; padding: 1rem; }
            .modal { max-height: 90vh; overflow-y: auto; }
        }
        
        /* Soporte para notch y dynamic island */
        @supports (padding: max(0px)) {
            header {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
            .container {
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
        }
        
        /* Prevent zoom en inputs */
        @media (max-width: 768px) {
            input, select, textarea {
                font-size: 16px;
            }
        }
        
        .detalle-evento { animation: fadeIn 0.5s ease; }
        .detalle-hero {
            width: 100%;
            height: 400px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            margin-bottom: 2rem;
            cursor: pointer;
        }
        .detalle-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;

        .galeria-item:hover .galeria-delete { opacity: 1; }

        .galeria-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        
        .lightbox {
            position: fixed;
            top: 0;

            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;

        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 12px; }

            position: absolute;
            top: 20px;

            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 24px;

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;

            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 24px;
            transition: background 0.3s;

        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? (window.location.protocol === 'https:' ? `https://${window.location.hostname}:8443` : 'http://localhost:8000')
            : 'https://getaccess.com.ar';
        const getImagenUrl = (img) => {
            if (!img) return null;
            // Si es un array real de JavaScript, usar la primera imagen
            if (Array.isArray(img) && img.length > 0) {
                img = img[0];
            }
            // Si es un string, verificar si contiene un JSON array
            if (img && typeof img === 'string') {
                const trimmed = img.trim();
                // Verificar si es un JSON array (comienza con [ o con " que indica JSON escapado)
                if (trimmed.startsWith('[') || trimmed.startsWith('%5B')) {
                    try {
                        let decoded = decodeURIComponent(trimmed);
                        const parsed = JSON.parse(decoded);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            img = parsed[0];
                        }
                    } catch (e) {
                        return null;
                    }
                }
                // Verificar si es un JSON array escapado ("[\"...\""])
                else if (trimmed.startsWith('"') && trimmed.includes('\\"')) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            img = parsed[0];
                        }
                    } catch (e) {
                        return null;
                    }
                }
            }
            // Verificar que img es válido antes de continuar
            if (!img || typeof img !== 'string') return null;
            // Si parece un JSON array, no usarla como URL
            if (img.startsWith('[') || img.startsWith('%5B') || img.startsWith('"')) return null;
            // Si es base64 (data:image...), retornarlo directamente
            if (img.startsWith('data:')) return img;
            // Si ya es una URL completa (http/https), retornarla
            if (img.startsWith('http')) return img;
            // Si es una ruta relativa (images/...), construir la URL completa
            if (img.startsWith('images/')) return API_URL + '/' + img;
            // Para cualquier otra cosa, intentar como ruta
            return API_URL + '/' + img;
        };
        const AuthContext = createContext(null);

        function App() {
            const [user, setUser] = useState(null);
            const [token, setToken] = useState(sessionStorage.getItem('token'));
            const [vista, setVista] = useState('eventos');
            const [eventoId, setEventoId] = useState(null);
            const [toast, setToast] = useState(null);
            const [pagoEstado, setPagoEstado] = useState(null);
            const [resetToken, setResetToken] = useState(null);
            const [transferenciasPendientes, setTransferenciasPendientes] = useState([]);
            const [carrito, setCarrito] = useState([]);
            
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const pago = params.get('pago');
                const reset = params.get('reset');
                const evento = params.get('evento');
                
                if (pago === 'exito') { setPagoEstado('success'); setVista('mis-entradas'); }
                else if (pago === 'fallo') { setPagoEstado('error'); }
                else if (pago === 'pendiente') { setPagoEstado('warning'); }
                
                if (reset) { setResetToken(reset); setVista('reset-password'); }
                
                // Soporte para URLs con public_id (?e=PUBLIC_ID) y backwards compatibility (?evento=ID)
                const publicId = params.get('e');
                const eventoIdParam = params.get('evento');
                
                if (publicId) {
                    // Nueva URL con public_id: ?e=A3K9M2X7
                    fetch(API_URL + '/api/eventos/public/' + publicId)
                    .then(res => res.ok ? res.json() : Promise.reject())
                    .then(data => {
                        setEventoId(data.id);
                        setVista('detalle-evento');
                    })
                    .catch(() => { console.log('Evento no encontrado'); });
                } else if (eventoIdParam) {
                    // Formato antiguo: ?evento=13 (backwards compatibility)
                    setEventoId(parseInt(eventoIdParam));
                    setVista('detalle-evento');
                }
                
                const savedToken = sessionStorage.getItem('token');
                if (savedToken) {
                    setToken(savedToken);
                    fetch(API_URL + '/api/auth/me', { headers: { Authorization: 'Bearer ' + savedToken } })
                    .then(res => res.ok ? res.json() : Promise.reject())
                    .then(data => { setUser(data); console.log('Usuario cargado:', data); })
                    .catch(() => { sessionStorage.removeItem('token'); setToken(null); console.log('Token inválido'); });
                }
            }, []);
            
            useEffect(() => {
                const savedCarrito = JSON.parse(localStorage.getItem('carrito') || '[]');
                setCarrito(savedCarrito);
            }, []);
            
            useEffect(() => {
                if (pagoEstado) {
                    const messages = { success: 'Pago exitoso! Tu entrada está confirmada.', error: 'El pago fue rechazado. Intenta nuevamente.', warning: 'Pago pendiente. Te notificaremos cuando se confirme.' };
                    showToast(messages[pagoEstado], pagoEstado);
                    window.history.replaceState({}, '', '/');
                    setTimeout(() => setPagoEstado(null), 3000);
                }
            }, [pagoEstado]);
            
            useEffect(() => {
                if (token) {
                    fetch(API_URL + '/api/transferencias/pendientes', { headers: { Authorization: 'Bearer ' + token } })
                    .then(res => res.ok ? res.json() : [])
                    .then(data => setTransferenciasPendientes(Array.isArray(data) ? data : []))
                    .catch(() => {});
                }
            }, [token]);
            
            const showToast = (message, type = 'success') => { setToast({ message, type }); setTimeout(() => setToast(null), 3000); };
            const login = (userData, token) => { setUser(userData); setToken(token); sessionStorage.setItem('token', token); const savedCarrito = JSON.parse(localStorage.getItem('carrito') || '[]'); setCarrito(savedCarrito); showToast('Bienvenido!'); };
            const logout = () => { setUser(null); setToken(null); sessionStorage.removeItem('token'); localStorage.removeItem('carrito'); setCarrito([]); setVista('eventos'); showToast('Sesion cerrada'); };
            
            const irADetalle = (id, publicId = null) => {
                setEventoId(id);
                setVista('detalle-evento');
                if (publicId) {
                    const url = new URL(window.location.href);
                    url.searchParams.set('e', publicId);
                    window.history.pushState({}, '', url);
                }
            };
            
            return (
                <AuthContext.Provider value={{ user, token, login, logout, showToast, setUser, setVista, irADetalle, setCarrito: setCarrito, setUser: setUser }}>
                    <Header vista={vista} setVista={setVista} user={user} logout={logout} carrito={carrito} />
                    <div className="container">
                        {vista === 'eventos' && <Eventos />}
                        {vista === 'registro' && <Registro setVista={setVista} />}
                        {vista === 'login' && <Login setVista={setVista} />}
                        {vista === 'buscar-entradas' && <BuscarEntradas />}
                        {vista === 'carrito' && <Carrito />}
                        {vista === 'mis-entradas' && <MisEntradas />}
                        {vista === 'aceptar-transferencia' && <AceptarTransferenciasList />}
                        {vista === 'perfil' && <Perfil />}
                        {vista === 'contacto' && <Contacto />}
                        {vista === 'admin' && <AdminPanel />}
                        {vista === 'recuperar' && <RecuperarPassword setVista={setVista} />}
                        {vista === 'reset-password' && <ResetPassword setVista={setVista} toast={toast} />}
                        {vista === 'detalle-evento' && <DetalleEvento eventoId={eventoId} />}
                        {vista === 'eventos' && (
                        <div style={{textAlign:'center', padding:'2rem', color:'var(--text-dim)', fontSize:'0.8rem', borderTop:'1px solid rgba(99,102,241,0.1)', marginTop:'2rem'}}>
                            <a href="/privacidad.html" style={{color:'var(--text-dim)', textDecoration:'none'}}>Política de Privacidad</a>
                        </div>
                        )}
                    </div>
                    {toast && <div className={'toast ' + toast.type}>{toast.message}</div>}
                </AuthContext.Provider>
            );
        }

        function Header({ vista, setVista, user, logout, carrito }) {
            return (
                <header>
                    <div className="logo" onClick={() => setVista('eventos')} style={{cursor:'pointer', display:'flex', alignItems:'center', gap:'10px'}}>
                        <svg width="40" height="40" viewBox="0 0 100 100" style={{filter:'drop-shadow(0 0 10px rgba(99,102,241,0.5))'}}>
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#6366f1"/>
                                    <stop offset="100%" stopColor="#ec4899"/>
                                </linearGradient>
                            </defs>
                            <rect x="10" y="25" width="80" height="55" rx="8" fill="url(#logoGrad)"/>
                            <circle cx="30" cy="52" r="8" fill="white"/>
                            <circle cx="70" cy="52" r="8" fill="white"/>
                            <rect x="38" y="48" width="24" height="8" fill="white" rx="2"/>
                            <rect x="35" y="15" width="30" height="15" rx="4" fill="url(#logoGrad)"/>
                        </svg>
                        <span style={{background:'linear-gradient(135deg, #6366f1, #ec4899)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', fontWeight:'700', fontSize:'1.3rem', letterSpacing:'-0.5px'}}>GET ACCESS</span>
                    </div>
                    <nav>
                        <button className={vista === 'eventos' ? 'active' : ''} onClick={() => setVista('eventos')}>🎉 Eventos</button>
                        {!user && <button className={vista === 'buscar-entradas' ? 'active' : ''} onClick={() => setVista('buscar-entradas')}>🔍 Mis Entradas</button>}
                        {user && (
                            <button className={vista === 'carrito' ? 'active' : ''} onClick={() => setVista('carrito')} style={{position: 'relative'}}>
                                🛒 Carrito {carrito.length > 0 && <span style={{position: 'absolute', top: '-5px', right: '-5px', background: '#ec4899', color: 'white', borderRadius: '50%', width: '20px', height: '20px', fontSize: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>{carrito.length}</span>}
                            </button>
                        )}
                        {user ? (
                            <>
                                <button className={vista === 'mis-entradas' ? 'active' : ''} onClick={() => setVista('mis-entradas')}>🎟️ Mis Entradas</button>
                                <button className={vista === 'perfil' ? 'active' : ''} onClick={() => setVista('perfil')}>👤 Perfil</button>
                                {(user && (user.rol === 'admin' || user.rol === 'organizer')) && <button className={vista === 'admin' ? 'active' : ''} onClick={() => setVista('admin')}>⚙️ Admin</button>}
                                <div className="user-info"><span>👤 {user.nombre}</span><button onClick={logout}>🚪 Cerrar sesión</button></div>
                            </>
                        ) : (
                            <>
                                <button className={vista === 'registro' ? 'active' : ''} onClick={() => setVista('registro')}>📝 Registrarse</button>
                                <button className={vista === 'login' ? 'active' : ''} onClick={() => setVista('login')}>🔐</button>
                                <button className={vista === 'contacto' ? 'active' : ''} onClick={() => setVista('contacto')}>📬 Contacto</button>
                            </>
                        )}
                    </nav>
                </header>
            );
        }

        function Eventos() {
            const [eventos, setEventos] = useState([]);
            const [categorias, setCategorias] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busqueda, setBusqueda] = useState('');
            const [categoriaFiltro, setCategoriaFiltro] = useState('');
            const [sugerencias, setSugerencias] = useState([]);
            const [recintos, setRecintos] = useState([]);
            const [mostrarSugerencias, setMostrarSugerencias] = useState(false);
            const { user, token, showToast, setVista, irADetalle } = useContext(AuthContext);
            const [modal, setModal] = useState(null);
            
            const parseFecha = (fecha) => {
                if (!fecha) return new Date(0);
                if (fecha.includes(' ') && fecha.match(/\d{2}:\d{2}:\d{2}/)) {
                    return new Date(fecha.replace(' ', 'T'));
                }
                return new Date(fecha + 'T12:00:00');
            };
            
            useEffect(() => {
                let mounted = true;
                const init = async () => {
                    await cargarEventos();
                    if (mounted) await cargarCategorias();
                };
                init();
                return () => { mounted = false; };
            }, [categoriaFiltro]);
            
            useEffect(() => {
                if (busqueda.length < 2) {
                    setSugerencias([]);
                    setRecintos([]);
                    setMostrarSugerencias(false);
                    return;
                }
                setMostrarSugerencias(true);
                const timeout = setTimeout(async () => {
                    try {
                        const res = await fetch(API_URL + '/api/eventos/buscar?q=' + encodeURIComponent(busqueda) + '&limite=8');
                        if (res.ok) {
                            const data = await res.json();
                            setSugerencias(Array.isArray(data.eventos) ? data.eventos : []);
                            setRecintos(data.recintos || []);
                        }
                    } catch (err) { setSugerencias([]); setRecintos([]); }
                }, 300);
                return () => clearTimeout(timeout);
            }, [busqueda]);
            
            const cargarCategorias = async () => {
                try {
                    const res = await fetch(API_URL + '/api/eventos/categorias');
                    if (res.ok) {
                        const data = await res.json();
                        setCategorias(Array.isArray(data) ? data : []);
                    }
                } catch (err) { console.error('Error cargando categorías:', err); }
            };
            
            const cargarEventos = async () => {
                setLoading(true);
                try {
                    let url = API_URL + '/api/eventos/';
                    const params = new URLSearchParams();
                    if (categoriaFiltro) params.append('categoria', categoriaFiltro);
                    if (busqueda) params.append('busqueda', busqueda);
                    if (params.toString()) url += '?' + params.toString();
                    
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Error del servidor');
                    const data = await res.json();
                    const eventosData = Array.isArray(data) ? data : [];
                    const ahora = new Date();
                    const sorted = eventosData.slice().sort((a, b) => {
                        const fa = parseFecha(a.fecha);
                        const fb = parseFecha(b.fecha);
                        const pasa = fa < ahora;
                        const pasb = fb < ahora;
                        if (pasa !== pasb) return pasa ? 1 : -1;
                        return fa - fb;
                    });
                    setEventos(sorted);
                } catch (err) {
                    console.error('Error cargando eventos:', err);
                    showToast('Error al cargar eventos. Reintentando...', 'error');
                    setTimeout(() => cargarEventos(), 2000);
                }
                setLoading(false);
            };
            
            const getEmoji = (nombre, categoria) => {
                if (categoria) {
                    const cats = { musica: '🎵', teatro: '🎭', deportes: '⚽', comedia: '😂', conferencia: '💼', espectaculo: '🎪' };
                    if (cats[categoria]) return cats[categoria];
                }
                const n = nombre?.toLowerCase() || '';
                if (n.includes('musica') || n.includes('festival')) return '🎵';
                if (n.includes('rock') || n.includes('concierto')) return '🎸';
                if (n.includes('comedia') || n.includes('stand up')) return '😂';
                if (n.includes('futbol') || n.includes('deporte') || n.includes('clásico')) return '⚽';
                if (n.includes('teatro') || n.includes('flamenco')) return '🎭';
                if (n.includes('tech') || n.includes('conferencia')) return '💼';
                return '🎉';
            };
            
            const comprar = async (cantidad) => {
                const savedToken = sessionStorage.getItem('token');
                const storedCarrito = JSON.parse(localStorage.getItem('carrito') || '[]');
                
                // Verificar si ya existe el evento en el carrito
                const idx = storedCarrito.findIndex(item => item.id === modal.id);
                
                if (idx >= 0) {
                    // Ya existe: incrementar cantidad
                    storedCarrito[idx].cantidad += cantidad;
                } else {
                    // Nuevo: agregar item
                    const nuevoItem = { id: modal.id, nombre: modal.nombre, fecha: modal.fecha, lugar: modal.lugar, precio: modal.precio, cantidad: cantidad, comision: modal.comision || 0 };
                    storedCarrito.push(nuevoItem);
                }
                
                localStorage.setItem('carrito', JSON.stringify(storedCarrito));
                showToast('Entrada agregada al carrito', 'success');
                setModal(null);
                if (!savedToken) {
                    showToast('Completa los datos del comprador para continuar', 'info');
                    setVista('carrito');
                }
            };
            
            if (loading) return <div className="loading">Cargando eventos...</div>;
            
            return (
                <>
                    <div className="hero">
                        <svg width="80" height="80" viewBox="0 0 100 100" style={{animation:'scaleIn 0.6s ease-out', marginBottom:'1rem'}}>
                            <defs>
                                <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#6366f1"/>
                                    <stop offset="100%" stopColor="#ec4899"/>
                                </linearGradient>
                            </defs>
                            <rect x="10" y="25" width="80" height="55" rx="8" fill="url(#heroGrad)"/>
                            <circle cx="30" cy="52" r="8" fill="white"/>
                            <circle cx="70" cy="52" r="8" fill="white"/>
                            <rect x="38" y="48" width="24" height="8" fill="white" rx="2"/>
                            <rect x="35" y="15" width="30" height="15" rx="4" fill="url(#heroGrad)"/>
                        </svg>
                        <h1 style={{animation:'slideDown 0.8s ease-out'}}>Get Access</h1>
                        <p style={{animation:'fadeIn 1s ease-out 0.3s both'}}>Descubre los mejores eventos y compra tus entradas de forma segura</p>
                    </div>
                    
                    <div style={{display:'flex', gap:'1rem', marginBottom:'2rem', flexWrap:'wrap', animation:'slideUp 0.8s ease-out 0.5s both', position:'relative', zIndex:9999}}>
                        <div style={{flex:1, minWidth:'200px', position:'relative', zIndex:9999}}>
                            <input 
                                type="text" 
                                placeholder="🔍 Buscar eventos..." 
                                value={busqueda}
                                onChange={e => setBusqueda(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && cargarEventos()}
                                onFocus={() => busqueda.length >= 2 && setMostrarSugerencias(true)}
                                onBlur={() => setTimeout(() => setMostrarSugerencias(false), 150)}
                                style={{width:'100%', padding:'1rem', borderRadius:'12px', border:'2px solid rgba(255,255,255,0.1)', background:'rgba(0,0,0,0.3)', color:'white', fontSize:'1rem'}}
                            />
                            {mostrarSugerencias && (sugerencias.length > 0 || recintos.length > 0) && (
                                <div style={{position:'absolute', top:'100%', left:0, right:0, background:'var(--bg-card)', borderRadius:'12px', border:'2px solid rgba(255,255,255,0.1)', marginTop:'0.5rem', maxHeight:'350px', overflowY:'auto', zIndex:9999, boxShadow:'0 4px 20px rgba(0,0,0,0.5)'}}>
                                    {sugerencias.length > 0 && (
                                        <div>
                                            <div style={{padding:'0.5rem 1rem', fontSize:'0.75rem', color:'var(--text-dim)', fontWeight:'bold', borderBottom:'1px solid rgba(255,255,255,0.1)'}}>EVENTOS</div>
                                            {sugerencias.map(sug => (
                                                <div key={sug.id} onMouseDown={(e) => { e.preventDefault(); irADetalle(sug.id, sug.public_id); setBusqueda(''); setSugerencias([]); setRecintos([]); setMostrarSugerencias(false); }} style={{padding:'0.75rem 1rem', cursor:'pointer', borderBottom:'1px solid rgba(255,255,255,0.05)', display:'flex', alignItems:'center', gap:'0.75rem', background:'transparent'}}>
                                                    {sug.imagen ? <img src={getImagenUrl(sug.imagen)} alt="" style={{width:40, height:40, objectFit:'cover', borderRadius:'8px'}} /> : <span style={{fontSize:'1.5rem'}}>🎫</span>}
                                                    <div style={{flex:1}}>
                                                        <div style={{fontWeight:'bold', color:'white'}}>{sug.nombre}</div>
                                                        <div style={{fontSize:'0.8rem', color:'var(--text-muted)'}}>📅 {parseFecha(sug.fecha).toLocaleDateString('es-AR')} • 📍 {sug.lugar}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {recintos.length > 0 && (
                                        <div>
                                            <div style={{padding:'0.5rem 1rem', fontSize:'0.75rem', color:'var(--text-dim)', fontWeight:'bold', borderBottom:'1px solid rgba(255,255,255,0.1)', marginTop:sugerencias.length > 0 ? '0.5rem' : 0}}>RECINTOS</div>
                                            {recintos.map((rec, idx) => (
                                                <div key={idx} onMouseDown={(e) => { e.preventDefault(); setBusqueda(rec.nombre); setCategoriaFiltro(''); cargarEventos(); setSugerencias([]); setRecintos([]); setMostrarSugerencias(false); }} style={{padding:'0.75rem 1rem', cursor:'pointer', borderBottom:'1px solid rgba(255,255,255,0.05)', display:'flex', alignItems:'center', gap:'0.75rem', background:'transparent'}}>
                                                    <span style={{fontSize:'1.5rem'}}>📍</span>
                                                    <div style={{flex:1}}>
                                                        <div style={{fontWeight:'bold', color:'white'}}>{rec.nombre}</div>
                                                        <div style={{fontSize:'0.8rem', color:'var(--text-muted)'}}>{rec.cantidad} evento{rec.cantidad !== 1 ? 's' : ''}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        <select 
                            value={categoriaFiltro} 
                            onChange={e => setCategoriaFiltro(e.target.value)}
                            style={{padding:'1rem', borderRadius:'12px', border:'2px solid rgba(255,255,255,0.1)', background:'var(--bg-card)', color:'white', fontSize:'1rem', minWidth:'150px'}}
                        >
                            <option value="">Todas las categorías</option>
                            {categorias.map(cat => (
                                <option key={cat} value={cat}>{cat.charAt(0).toUpperCase() + cat.slice(1)}</option>
                            ))}
                        </select>
                        <button className="btn" onClick={cargarEventos}>Buscar</button>
                    </div>
                    
                    <h1 style={{animation:'fadeIn 0.8s ease-out 0.6s both'}}>Próximos Eventos {categoriaFiltro ? `- ${categoriaFiltro.charAt(0).toUpperCase() + categoriaFiltro.slice(1)}` : ''}</h1>
                    {eventos.length === 0 ? (
                        <div className="empty-state"><span>🎫</span><p>No hay eventos {categoriaFiltro ? 'en esta categoría' : 'disponibles'}</p></div>
                    ) : (
                        <div className="eventos-grid">
                            {eventos.map(evento => {
                                const esPasado = parseFecha(evento.fecha) < new Date();
                                return (
                                <div key={evento.id} className="evento-card" style={{opacity: esPasado ? 0.6 : 1}}>
                                    <div className="evento-img" onClick={() => !esPasado && irADetalle(evento.id, evento.public_id)} style={{cursor: esPasado ? 'default' : 'pointer'}}>
                                        {evento.imagen ? (
                                            <img src={getImagenUrl(evento.imagen)} alt={evento.nombre} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                        ) : null}
                                        <span style={{display: evento.imagen ? 'none' : 'flex', fontSize:'4rem'}}>{getEmoji(evento.nombre, evento.categoria)}</span>
                                        {esPasado && <div style={{position:'absolute',top:'10px',right:'10px',background:'rgba(0,0,0,0.8)',padding:'0.5rem 1rem',borderRadius:'8px',fontSize:'0.9rem',fontWeight:'bold'}}>🏁 Finalizado</div>}
                                    </div>
                                    <div className="evento-info">
                                        {evento.categoria && <span style={{fontSize:'0.75rem', background:'rgba(99,102,241,0.2)', padding:'0.25rem 0.75rem', borderRadius:'20px', color:'var(--primary-light)', display:'inline-block', marginBottom:'0.5rem'}}>{evento.categoria.toUpperCase()}</span>}
                                        <h3 onClick={() => !esPasado && irADetalle(evento.id, evento.public_id)} style={{cursor: esPasado ? 'default' : 'pointer'}}>{evento.nombre}</h3>
                                        <div className="evento-meta"><span>📅 {parseFecha(evento.fecha).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' })}</span><span>📍 {evento.lugar}</span></div>
                                        <p className="evento-desc">{evento.descripcion}</p>
                                        <div className="evento-footer">
                                            <div><div className="precio">${evento.precio.toLocaleString('es-AR')}</div><div className={'disponibles ' + (evento.disponibles < 50 ? 'low' : '')}>{evento.disponibles} disponibles</div></div>
                                            <button className="btn" disabled={evento.disponibles === 0 || esPasado} onClick={() => { if(esPasado) return; setModal(evento); }}>{evento.disponibles === 0 ? 'Agotado' : esPasado ? '🏁 Finalizado' : '🎫 Comprar'}</button>
                                        </div>
                                    </div>
                                </div>
                            )})}
                        </div>
                    )}
                    {modal && <ModalCompra evento={modal} onClose={() => setModal(null)} onConfirm={comprar} />}
                </>
            );
        }

        function DetalleEvento({ eventoId }) {
            const [evento, setEvento] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [modal, setModal] = useState(null);
            const [lightbox, setLightbox] = useState(null);
            const [nuevaImagen, setNuevaImagen] = useState('');
            const { user, token, showToast, setVista } = useContext(AuthContext);
            const isAdmin = user && user.rol === 'admin';
            
            const parseFecha = (fecha) => {
                if (!fecha) return new Date(0);
                if (fecha.includes(' ') && fecha.match(/\d{2}:\d{2}:\d{2}/)) {
                    return new Date(fecha.replace(' ', 'T'));
                }
                return new Date(fecha + 'T12:00:00');
            };
            
            useEffect(() => {
                cargarEvento();
            }, [eventoId]);
            
            const cargarEvento = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(API_URL + '/api/eventos/' + eventoId);
                    if (!res.ok) {
                        if (res.status === 404) setError('Evento no encontrado');
                        else throw new Error('Error del servidor');
                        return;
                    }
                    const data = await res.json();
                    setEvento(data);
                } catch (err) {
                    setError(err.message);
                    showToast('Error al cargar el evento', 'error');
                }
                setLoading(false);
            };
            
            const comprar = async (cantidad) => {
                const savedToken = sessionStorage.getItem('token');
                const storedCarrito = JSON.parse(localStorage.getItem('carrito') || '[]');
                
                // Verificar si ya existe el evento en el carrito
                const idx = storedCarrito.findIndex(item => item.id === evento.id);
                
                if (idx >= 0) {
                    // Ya existe: incrementar cantidad
                    storedCarrito[idx].cantidad += cantidad;
                } else {
                    // Nuevo: agregar item
                    const nuevoItem = { id: evento.id, nombre: evento.nombre, fecha: evento.fecha, lugar: evento.lugar, precio: evento.precio, cantidad: cantidad };
                    storedCarrito.push(nuevoItem);
                }
                
                localStorage.setItem('carrito', JSON.stringify(storedCarrito));
                showToast('Entrada agregada al carrito', 'success');
                setModal(null);
                if (!savedToken) {
                    showToast('Completa los datos del comprador para continuar', 'info');
                    setVista('carrito');
                }
            };
            
            const agregarImagen = async () => {
                if (!nuevaImagen.trim()) { showToast('Ingresa una URL o selecciona un archivo', 'error'); return; }
                try {
                    const formData = new FormData();
                    formData.append('url', nuevaImagen);
                    formData.append('orden', evento.imagenes?.length || 0);
                    const res = await fetch(API_URL + '/api/eventos/' + eventoId + '/imagenes', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    if (res.ok) {
                        showToast('Imagen agregada', 'success');
                        setNuevaImagen('');
                        cargarEvento();
                    } else {
                        const data = await res.json();
                        showToast(data.detail || 'Error al agregar imagen', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
            };
            
            const eliminarImagen = async (imagenId) => {
                if (!confirm('¿Eliminar esta imagen?')) return;
                try {
                    const res = await fetch(API_URL + '/api/eventos/' + eventoId + '/imagenes/' + imagenId, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        showToast('Imagen eliminada', 'success');
                        cargarEvento();
                    } else {
                        const data = await res.json();
                        showToast(data.detail || 'Error al eliminar', 'error');
                    }
                } catch (err) { showToast('Error de conexión', 'error'); }
            };
            
            const todasImagenes = evento ? (
                evento.imagen && (
                    evento.imagen.startsWith('[') || evento.imagen.startsWith('"')
                ) 
                    ? (() => { try { return JSON.parse(evento.imagen); } catch(e) { return []; } })()
                    : evento.imagen ? [evento.imagen] : []
            ).concat((evento.imagenes || []).map(i => i.url)).filter(Boolean) : [];
            
            if (loading) return <div className="loading">Cargando...</div>;
            if (error) return <div className="empty-state"><span>❌</span><p>{error}</p><button className="btn" onClick={() => setVista('eventos')}>Volver a eventos</button></div>;
            if (!evento) return null;
            
            return (
                <div className="detalle-evento">
                    <button onClick={() => setVista('eventos')} style={{background:'transparent', border:'none', color:'var(--text-muted)', cursor:'pointer', display:'flex', alignItems:'center', gap:'0.5rem', marginBottom:'1rem', fontSize:'0.9rem'}}>← Volver a eventos</button>
                    
                    <div className="detalle-hero" onClick={() => todasImagenes.length > 0 && setLightbox(0)}>
                        {evento.imagen ? (
                            <img src={getImagenUrl(evento.imagen)} alt={evento.nombre} />
                        ) : (
                            <div style={{width:'100%',height:'100%',background:'linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'6rem'}}>🎉</div>
                        )}
                        <div className="detalle-hero-overlay">
                            {evento.categoria && <span className="detalle-categoria">{evento.categoria.toUpperCase()}</span>}
                            <h1>{evento.nombre}</h1>
                        </div>
                    </div>
                    
                    <div className="detalle-info">
                        <div>
                            <div className="detalle-descripcion">
                                <h2 style={{marginBottom:'1rem', color:'var(--text)'}}>📄 Acerca del evento</h2>
                                <p>{evento.descripcion || 'Sin descripción disponible.'}</p>
                            </div>
                            
                            {todasImagenes.length > 0 && (
                                <div className="galeria">
                                    <h2 style={{color:'var(--text)', marginTop:'2rem', marginBottom:'0.5rem'}}>🖼️ Galería</h2>
                                    <div className="galeria-grid">
                                        {todasImagenes.map((img, idx) => (
                                            <div key={idx} className="galeria-item" onClick={() => setLightbox(idx)}>
                                                <img src={getImagenUrl(img)} alt={'Imagen ' + (idx + 1)} onError={e => e.target.style.display='none'} />
                                                {isAdmin && idx > 0 && (
                                                    <button className="galeria-delete" onClick={e => { e.stopPropagation(); eliminarImagen(evento.imagenes?.[idx - 1]?.id); }}>✕</button>
                                                )}
                                            </div>
                                        ))}
                                        {isAdmin && (
                                            <div className="galeria-add">
                                                <input type="url" placeholder="URL de imagen" value={nuevaImagen} onChange={e => setNuevaImagen(e.target.value)} onClick={e => e.stopPropagation()} style={{width:'80%',padding:'0.5rem',border:'none',background:'transparent',color:'white',textAlign:'center',fontSize:'0.85rem'}} />
                                                <button onClick={e => { e.stopPropagation(); agregarImagen(); }} style={{background:'var(--primary)',border:'none',color:'white',padding:'0.5rem 1rem',borderRadius:'8px',cursor:'pointer',fontSize:'0.85rem',marginTop:'0.5rem'}}>Agregar</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="detalle-sidebar">
                            <div className="detalle-card">
                                <h3>📅 Fecha y Hora</h3>
                                <p>{parseFecha(evento.fecha).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                                <p style={{fontSize:'0.9rem', marginTop:'0.5rem', color:'var(--text-dim)'}}>Verificar horario en la web del evento</p>
                            </div>
                            
                            <div className="detalle-card">
                                <h3>📍 Ubicación</h3>
                                <p>{evento.lugar}</p>
                            </div>
                            
                            <div className="detalle-card">
                                <h3>🎟️ Entradas</h3>
                                <p style={{marginBottom:'1rem'}}>Disponibles: <strong style={{color:'var(--success)'}}>{evento.disponibles}</strong> de {evento.capacidad}</p>
                                {evento.disponibles < 50 && <p style={{color:'var(--error)', fontSize:'0.85rem'}}>⚠️ ¡Quedan pocas entradas!</p>}
                                <div className="detalle-precio" style={{marginBottom:'1rem'}}>${evento.precio.toLocaleString('es-AR')}</div>
                                <button className="btn btn-block" disabled={evento.disponibles === 0} onClick={() => { setModal(evento); }}>{evento.disponibles === 0 ? 'Agotado' : '🎫 Comprar Entrada'}</button>
                            </div>
                        </div>
                    </div>
                    
                    {modal && <ModalCompra evento={modal} onClose={() => setModal(null)} onConfirm={comprar} />}
                    
                    {lightbox !== null && (
                        <div className="lightbox" onClick={() => setLightbox(null)}>
                            <button className="lightbox-close" onClick={() => setLightbox(null)}>✕</button>
                            {todasImagenes.length > 1 && <button className="lightbox-nav lightbox-prev" onClick={e => { e.stopPropagation(); setLightbox((lightbox - 1 + todasImagenes.length) % todasImagenes.length); }}>‹</button>}
                            <img src={todasImagenes[lightbox]} alt="Galería" onClick={e => e.stopPropagation()} />
                            {todasImagenes.length > 1 && <button className="lightbox-nav lightbox-next" onClick={e => { e.stopPropagation(); setLightbox((lightbox + 1) % todasImagenes.length); }}>›</button>}
                        </div>
                    )}
                </div>
            );
        }

        function ModalCompra({ evento, onClose, onConfirm }) {
            const [cantidad, setCantidad] = useState(1);
            const comision = evento.comision || 0;
            const precioBase = evento.precio;
            const precioConComision = precioBase * (1 + comision / 100);
            const total = precioConComision * cantidad;
            const parseFecha = (fecha) => {
                if (!fecha) return new Date(0);
                if (fecha.includes(' ') && fecha.match(/\d{2}:\d{2}:\d{2}/)) {
                    return new Date(fecha.replace(' ', 'T'));
                }
                return new Date(fecha + 'T12:00:00');
            };
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <h3>🎫 Confirmar Compra</h3>
                        <div className="modal-info">
                            <p><strong>🎪 Evento:</strong> <span>{evento.nombre}</span></p>
                            <p><strong>💰 Precio:</strong> <span>${precioBase.toLocaleString('es-AR')}</span></p>
                            {comision > 0 && <p><strong>💼 Cargo por servicios:</strong> <span>${((precioConComision - precioBase) * cantidad).toLocaleString('es-AR')}</span></p>}
                            <p><strong>📅 Fecha:</strong> <span>{parseFecha(evento.fecha).toLocaleDateString('es-AR')}</span></p>
                            <p><strong>📍 Lugar:</strong> <span>{evento.lugar}</span></p>
                        </div>
                        <div className="form-group"><label>🎟️ Cantidad:</label><input type="number" value={cantidad} onChange={e => setCantidad(parseInt(e.target.value) || 1)} min="1" max={Math.min(10, evento.disponibles)} /></div>
                        {comision > 0 ? (
                            <>
                                <div style={{fontSize:'0.9rem', color:'#888', margin:'0.5rem 0'}}>
                                    <div>💵 Subtotal: ${(precioBase * cantidad).toLocaleString('es-AR')}</div>
                                    <div>📦 Cargo por servicios: ${((precioConComision - precioBase) * cantidad).toLocaleString('es-AR')}</div>
                                </div>
                                <div className="modal-total">💵 Total: ${total.toLocaleString('es-AR')}</div>
                            </>
                        ) : (
                            <div className="modal-total">💵 Total: ${(evento.precio * cantidad).toLocaleString('es-AR')}</div>
                        )}
                        <div className="modal-buttons"><button className="btn btn-secondary" onClick={onClose}>❌ Cancelar</button><button className="btn" onClick={() => onConfirm(cantidad)}>💳 Comprar</button></div>
                    </div>
                </div>
            );
        }

        function Registro({ setVista }) {
            const [form, setForm] = useState({ email: '', nombre: '', apellido: '', password: '' });
            const [confirmPassword, setConfirmPassword] = useState('');
            const [codigo, setCodigo] = useState('');
            const [codigoBackend, setCodigoBackend] = useState('');
            const [enviado, setEnviado] = useState(false);
            const [errorEmail, setErrorEmail] = useState('');
            const [loading, setLoading] = useState(false);
            const { login, showToast } = useContext(AuthContext);
            const handleSubmit = async (e) => {
                e.preventDefault();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(form.email)) { setErrorEmail(''); showToast('Ingrese un email válido', 'error'); return; }
                if (form.password !== confirmPassword) { setErrorEmail(''); showToast('Las contraseñas no coinciden', 'error'); return; }
                setLoading(true);
                const res = await fetch(API_URL + '/api/auth/registro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
                const data = await res.json();
                setLoading(false);
                if (res.ok) { 
                    setEnviado(true); 
                    setErrorEmail(''); 
                    showToast('Código enviado a tu email (revisa también SPAM)', 'success');
                }
                else if (data.detail && data.detail.includes('ya registrado')) { setErrorEmail('Este email ya está registrado'); }
                else if (data.detail) { showToast(data.detail, 'error'); setErrorEmail(data.detail); }
                else { setErrorEmail(''); showToast(data.detail || 'Error al registrar', 'error'); }
            };
            const handleVerificar = async (e) => {
                e.preventDefault();
                setLoading(true);
                const res = await fetch(API_URL + '/api/auth/verificar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({email: form.email, codigo: codigo}) });
                const data = await res.json();
                setLoading(false);
                if (res.ok) { login(data.user, data.access_token); setVista('eventos'); showToast('Email verificado correctamente', 'success'); }
                else showToast(data.detail || 'Código incorrecto', 'error');
            };
            if (enviado) {
                return (
                    <div className="form-page"><div className="form-box"><h2>✅ Verificar Email</h2><p style={{marginBottom:'15px',color:'#666'}}>Ingresa el código de 6 dígitos que enviamos a <b>{form.email}</b></p>
                        <div style={{background:'#fffbeb',border:'1px solid #f59e0b',borderRadius:'8px',padding:'10px',marginBottom:'15px',fontSize:'12px',color:'#92400e'}}>
                            ⚠️ Si no recibiste el email, revisa la carpeta de <strong>SPAM</strong>.
                        </div>
                    <form onSubmit={handleVerificar}>
                        <div className="form-group"><label>🔢 Código de verificación</label><input type="text" value={codigo} onChange={e => setCodigo(e.target.value)} maxLength="6" pattern="[0-9]{6}" disabled={loading} required /></div>
                        <button type="submit" className="btn btn-block" disabled={loading}>{loading ? <span className="spinner"></span> : '✅ Verificar'}</button>
                    </form></div></div>
                );
            }
            return (
                <div className="form-page"><div className="form-box"><h2>📝 Registrarse</h2><form onSubmit={handleSubmit}>
                    <div className="form-group"><label>📧 Email</label><input type="email" value={form.email} onChange={e => { setForm({...form, email: e.target.value}); setErrorEmail(''); }} disabled={loading} required /></div>
                    {errorEmail && <div style={{color:'#ef4444',fontSize:'14px',marginBottom:'10px',fontWeight:'bold'}}>⚠️ {errorEmail}</div>}
                    <div className="form-group"><label>👤 Nombre</label><input type="text" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} disabled={loading} required /></div>
                    <div className="form-group"><label>👤 Apellido</label><input type="text" value={form.apellido} onChange={e => setForm({...form, apellido: e.target.value})} disabled={loading} required /></div>
                    <div className="form-group"><label>🔑 Contraseña</label><input type="password" value={form.password} onChange={e => setForm({...form, password: e.target.value})} disabled={loading} minLength="8" required /></div>
                    <div className="form-group"><label>🔑 Confirmar Contraseña</label><input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} disabled={loading} minLength="8" required /></div>
                    <small style={{color:'#666',fontSize:'12px'}}>Mín: 8 caracteres, 1 mayúscula, 1 minúscula, 1 número, 1 especial (!@#$%...)</small>
                    <button type="submit" className="btn btn-block" disabled={loading}>{loading ? <span className="spinner"></span> : '📝 Registrarse'}</button>
                </form></div></div>
            );
        }

        function Login({ setVista }) {
            const [form, setForm] = useState({ email: '', password: '' });
            const [loading, setLoading] = useState(false);
            const { login, showToast } = useContext(AuthContext);
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
