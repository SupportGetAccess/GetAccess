name: Daily Backup

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psycopg2-binary
      
      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/backup.py
      
      - name: Commit backup
        run: |
          git config --local user.email "backup@getaccess.com"
          git config --local user.name "GetAccess Backup"
          git add backups/
          git commit -m "Backup: $(date +%Y-%m-%d)" || exit 0
          git push
