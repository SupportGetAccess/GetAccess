name: Ping Render
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render to wake up
        run: sleep 10
      
      - name: Ping Render
        run: |
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://getaccess-d3um.onrender.com/)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1