name: Daily Backup

on:
  schedule:
    # Corre todos los dias a las 6:00 UTC (3:00 Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecucion manual

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GIT_PAT }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psycopg2-binary
      
      - name: Run backup
        env:
          SUPABASE_URI: postgresql://postgres.xgwbcepopluehupublkz:%40Supabase1982@aws-1-sa-east-1.pooler.supabase.com:5432/postgres
        run: python backend/backup.py > output.log 2>&1 || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: backup-logs
          path: output.log
      
      - name: Commit backup
        run: |
          git config --local user.email "backup@getaccess.com"
          git config --local user.name "GetAccess Backup"
          git add -f backups/
          git commit -m "Backup: $(date +%Y-%m-%d)" || exit 0
          git push